<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of the kingdoms of Kush, about 2500 BCE to 350 CE (approximate dates)</title>
  <rect width="1200" height="470" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE KINGDOMS OF KUSH · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">All dates approximate; the chronology of the 25th Dynasty and of Meroë's end is still debated</text>
  <rect x="93.8" y="215" width="337.5" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="262.5" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Kerma kingdom</text>
  <rect x="431.2" y="215" width="145.1" height="30" fill="#8f8a7c22" stroke="#8f8a7c" stroke-dasharray="5 4"/>
  <text x="503.8" y="235" text-anchor="middle" fill="#bdb6a3" font-size="14">Egyptian rule</text>
  <rect x="633.8" y="215" width="212.6" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="740.1" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Napatan period</text>
  <rect x="846.4" y="215" width="209.2" height="30" fill="#c9a54a33" stroke="#e8c46a"/>
  <text x="951.0" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Meroitic period</text>
  <line x1="60" y1="255" x2="1140" y2="255" stroke="#c9a54a"/>
  <text x="93.8" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">2500 BCE</text>
  <text x="262.5" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">2000 BCE</text>
  <text x="431.2" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">1500 BCE</text>
  <text x="600.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">1000 BCE</text>
  <text x="768.8" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">500 BCE</text>
  <text x="937.8" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">1 CE</text>
  <text x="1106.2" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">500 CE</text>
  <g transform="translate(262.5,0)"><line y1="165" y2="215" stroke="#e8c46a"/><rect x="-5" y="155" width="10" height="10" transform="rotate(45 0 160)" fill="#e8c46a"/><text y="143" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 2000–1500 Kerma at its height</text><text y="127" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">royal tumuli and the deffufa temple</text></g>
  <g transform="translate(431.2,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">c. 1500 Thutmose I</text><text y="343" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">Egypt conquers Kerma</text></g>
  <g transform="translate(691.8,0)"><line y1="125" y2="215" stroke="#e8c46a"/><rect x="-5" y="115" width="10" height="10" transform="rotate(45 0 120)" fill="#e8c46a"/><text y="103" x="10" text-anchor="end" fill="#e9e2cf" font-size="13">c. 728 Piye's campaign</text><text y="87" x="10" text-anchor="end" fill="#8f8a7c" font-size="12">Victory Stela at Jebel Barkal</text></g>
  <g transform="translate(704.6,0)"><line y1="180" y2="215" stroke="#e8c46a"/><rect x="-5" y="170" width="10" height="10" transform="rotate(45 0 175)" fill="#e8c46a"/><text y="158" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">690–664 Taharqa</text><text y="142" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">largest pyramid at Nuri</text></g>
  <g transform="translate(713.4,0)"><line y1="255" y2="365" stroke="#e8c46a"/><rect x="-5" y="365" width="10" height="10" transform="rotate(45 0 370)" fill="#e8c46a"/><text y="395" x="14" text-anchor="end" fill="#e9e2cf" font-size="13">c. 664–656 Tantamani</text><text y="413" x="14" text-anchor="end" fill="#8f8a7c" font-size="12">Kushite rule in Egypt ends</text></g>
  <g transform="translate(836.2,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">3rd century BCE</text><text y="343" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">royal burials move to Meroë</text></g>
  <g transform="translate(929.1,0)"><line y1="125" y2="215" stroke="#e8c46a"/><rect x="-5" y="115" width="10" height="10" transform="rotate(45 0 120)" fill="#e8c46a"/><text y="103" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 25 BCE war with Rome</text><text y="87" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">the Candace and Petronius</text></g>
  <g transform="translate(1052.2,0)"><line y1="255" y2="365" stroke="#e8c46a"/><rect x="-5" y="365" width="10" height="10" transform="rotate(45 0 370)" fill="#e8c46a"/><text y="395" x="14" text-anchor="end" fill="#e9e2cf" font-size="13">mid-4th century CE</text><text y="413" x="14" text-anchor="end" fill="#8f8a7c" font-size="12">Aksumite campaigns; Meroë fades</text></g>
  <text x="15" y="460" text-anchor="start" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
