<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of Tiwanaku and the southern Lake Titicaca basin, about 200 BCE to the 16th century CE (approximate and debated dates)</title>
<rect width="1200" height="520" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">TIWANAKU · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Dates rest on radiocarbon ranges and are approximate; the start of the city and the cause of its decline are both debated</text>
<rect x="80.0" y="150" width="404.4" height="28" fill="#7a6a9a55" stroke="#e8c46a55"/><text x="282.2" y="169" text-anchor="middle" fill="#f1e6c8" font-size="14">Late Formative period (c. 200 BCE–500 CE)</text>
<rect x="259.1" y="190" width="572.0" height="28" fill="#c9a54a55" stroke="#e8c46a55"/><text x="545.1" y="209" text-anchor="middle" fill="#f1e6c8" font-size="14">Tiwanaku occupied (founding modelled c. 110 CE)</text>
<rect x="484.4" y="232" width="288.9" height="28" fill="#4a7ec955" stroke="#e8c46a55"/><text x="628.9" y="251" text-anchor="middle" fill="#f1e6c8" font-size="14">Heyday and colonies</text>
<rect x="831.1" y="272" width="173.3" height="28" fill="#c96a4a66" stroke="#e8c46a55"/><text x="917.8" y="291" text-anchor="middle" fill="#f1e6c8" font-size="14">Proposed drought (debated)</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
<text x="80.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">200 BCE</text>
<text x="196.1" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1 CE</text>
<text x="311.1" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">200</text>
<text x="426.7" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">400</text>
<text x="542.2" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">600</text>
<text x="657.8" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">800</text>
<text x="773.3" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1000</text>
<text x="888.9" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1200</text>
<text x="1004.4" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1400</text>
<text x="1120.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1600</text>
<line x1="259.1" y1="330" x2="259.1" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="259.1" cy="330" r="5" fill="#e8c46a"/><text x="259.1" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">c. 110 CE (modelled)</text><text x="259.1" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">Tiwanaku founded</text>
<line x1="704.0" y1="330" x2="704.0" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="704.0" cy="330" r="5" fill="#e8c46a"/><text x="704.0" y="448" text-anchor="middle" fill="#e8c46a" font-size="14">c. 800–960</text><text x="704.0" y="464" text-anchor="middle" fill="#d8d2c0" font-size="13">Khoa reef offerings</text>
<line x1="831.1" y1="330" x2="831.1" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="831.1" cy="330" r="5" fill="#e8c46a"/><text x="831.1" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">11th–12th c.</text><text x="831.1" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">City declines</text>
<line x1="1091.1" y1="330" x2="1091.1" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="1091.1" cy="330" r="5" fill="#e8c46a"/><text x="1091.1" y="448" text-anchor="end" fill="#e8c46a" font-size="14">16th c.</text><text x="1091.1" y="464" text-anchor="end" fill="#d8d2c0" font-size="13">Spanish describe unfinished Puma Punku</text>
<text x="80" y="510" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Dates follow the sources cited in the article; the founding date follows Marsh (2012), and the drought and its role in the collapse are disputed.</text></svg>