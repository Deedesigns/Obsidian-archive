<script id="story" type="application/json">{"title": "Big Red: The True Story of a Fire Engine", "date": "2026-11-03", "cover": {"text": "Big Red: The True Story of a Fire Engine.", "image": "cover.webp", "audio": "cover.mp3", "scene": "Big Red parked proudly on the driveway in front of an open red-brick fire station at golden hour, seen from the front three-quarter view, with the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing; the four crew members in tan turnout gear standing in front of the truck, smiling and waving; warm, friendly, heroic. This cover has NO title and NO words anywhere"}, "pages": [{"text": "", "spokenText": "This is Big Red, a real fire engine. Big Red lives at the fire station with a friendly firefighter crew.", "scene": "Big Red parked inside an open bay of a cozy red-brick fire station, seen from the front, low in the picture; the four crew members in navy T-shirts standing beside the truck smiling and waving. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth warm cream-painted station wall above the open bay door", "image": "p01.webp", "audio": "p01.mp3", "safe": 0.016, "sky": "#ecc7a2", "textTone": "dark"}, {"text": "", "spokenText": "These firefighters work, eat and even sleep at the station, so they are ready to help, day or night.", "scene": "a cutaway view of the cozy fire station: low in the picture the crew in navy T-shirts laughing around a small kitchen table, and next to it a neat row of simple beds; Big Red’s red front peeking in from the right. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth soft sky-blue painted wall", "image": "p02.webp", "audio": "p02.mp3", "safe": 0.016, "sky": "#5d95cd", "textTone": "light"}, {"text": "", "spokenText": "Every morning, the crew checks Big Red. Lights? Shining. Hoses? Rolled tight. Water tank? Full to the top!", "scene": "in front of the station on a sunny driveway, the crew in navy T-shirts checking Big Red: the captain holding a clipboard with a blank page, one firefighter giving a thumbs-up by the glowing headlights, one patting a rolled hose, one looking at the round gauges on the pump panel. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue morning sky", "image": "p03.webp", "audio": "p03.mp3", "safe": 0.328, "sky": "#76aee1", "textTone": "dark"}, {"text": "", "spokenText": "Then they practice drills, again and again, so their hands know just what to do when someone needs help.", "scene": "the station’s grassy practice yard: the crew in turnout gear practicing, two of them unrolling a long flat hose across the grass, one carrying a silver ground ladder, the captain watching and smiling; Big Red parked at the side. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p04.webp", "audio": "p04.mp3", "safe": 0.323, "sky": "#70addf", "textTone": "dark"}, {"text": "", "spokenText": "Ding, ding, ding! The alarm rings! A smoky little fire is in a backyard shed. Time to go!", "scene": "inside the fire station, low in the picture: the crew in navy T-shirts hurrying happily toward Big Red, a red alarm light glowing softly on the wall at the far right, excited but calm faces. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth warm cream-painted station wall", "image": "p05.webp", "audio": "p05.mp3", "safe": 0.318, "sky": "#fbd6aa", "textTone": "dark"}, {"text": "", "spokenText": "The crew jumps into turnout gear: thick pants, big boots, a heavy coat and a strong helmet.", "scene": "beside Big Red inside the station, the crew quickly pulling on their tan turnout pants with suspenders, stepping into black boots, shrugging on coats and putting on helmets; the gear rack low beside them. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth warm cream-painted station wall", "image": "p06.webp", "audio": "p06.mp3", "safe": 0.24, "sky": "#fde3c0", "textTone": "dark"}, {"text": "", "spokenText": "Each firefighter also wears an air tank on their back, so they can breathe clean air near smoke.", "scene": "close-up of two crew members in full tan turnout gear and helmets, smiling, one helping the other buckle the straps of a silver air tank on her back; a clear face mask hanging at their chests. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth warm cream-painted station wall", "image": "p07.webp", "audio": "p07.mp3", "safe": 0.323, "sky": "#f9dbb7", "textTone": "dark"}, {"text": "", "spokenText": "Wee-oo, wee-oo! Lights flash and the siren sings, so cars pull over to let Big Red zoom by.", "scene": "Big Red driving down a sunny tree-lined town street low in the picture, roof lights glowing red and white, the captain and crew visible through the windows; two small cars pulled over to the side of the road. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p08.webp", "audio": "p08.mp3", "safe": 0.365, "sky": "#6aa9e0", "textTone": "dark"}, {"text": "", "spokenText": "At the house, the family is already safe outside, waiting on the sidewalk with their little dog.", "scene": "a friendly suburban house; on the sidewalk a calm family (a dad, a mom and a little girl) holding a small fluffy white dog, waving at Big Red, which has just parked at the curb; behind the house a thin wisp of gray smoke rises from a small backyard shed. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p09.webp", "audio": "p09.mp3", "safe": 0.391, "sky": "#68a8df", "textTone": "dark"}, {"text": "", "spokenText": "Big Red carries its own tank of water, and a strong pump inside pushes the water through the hose.", "scene": "close-up of Big Red’s side pump panel low in the picture: the young firefighter woman with the braid turning a big silver valve, round gauges, a flat hose filling up round as water rushes through it. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p10.webp", "audio": "p10.mp3", "safe": 0.401, "sky": "#78b0e1", "textTone": "dark"}, {"text": "", "spokenText": "For extra water, a firefighter hooks a big hose to the yellow fire hydrant. Twist, twist, click!", "scene": "by the curb, the tall firefighter with the ginger beard kneeling at a short yellow fire hydrant, connecting a thick hose with a big wrench, smiling; Big Red parked behind him. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p11.webp", "audio": "p11.mp3", "safe": 0.266, "sky": "#77b4e5", "textTone": "dark"}, {"text": "", "spokenText": "Whoosh! The captain points, and the crew sprays the water. The smoky little fire hisses and goes out.", "scene": "in the backyard, the captain pointing calmly while two firefighters hold the hose and spray a strong stream of water at a small wooden garden shed; a little puff of white steam and gray smoke; no flames, nobody in danger, calm and safe. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p12.webp", "audio": "p12.mp3", "safe": 0.016, "sky": "#71a8da", "textTone": "dark"}, {"text": "", "spokenText": "A firefighter climbs a ladder to check the shed roof. All clear! Nobody is hurt, and everyone cheers.", "scene": "a silver ground ladder leaning against the small wet wooden shed; the firefighter with the mustache halfway up giving a thumbs-up; below, the captain and crew cheering, and the family with their little white dog clapping by the fence. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue sky", "image": "p13.webp", "audio": "p13.mp3", "safe": 0.323, "sky": "#6babe5", "textTone": "dark"}, {"text": "", "spokenText": "Long ago, fire engines were pulled by horses, and spotted Dalmatian dogs ran beside them to clear the way.", "scene": "a scene from long ago: an old-fashioned shiny red horse-drawn fire wagon with big spoked wheels and a brass boiler, pulled by two brown horses trotting along a cobblestone street, and a spotted Dalmatian dog running happily beside them; old brick buildings low in the background; Big Red and the crew are not in this picture. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm soft golden-peach old-time sky", "image": "p14.webp", "audio": "p14.mp3", "safe": 0.365, "sky": "#fdd297", "textTone": "dark"}, {"text": "", "spokenText": "Back at the station, the crew scrubs Big Red with soapy sponges until it shines like a bright red cherry.", "scene": "on the station driveway, the crew in navy T-shirts washing Big Red with big soapy sponges, buckets and a gentle hose; bubbles floating low; laughing faces. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm clear pale-blue late-afternoon sky", "image": "p15.webp", "audio": "p15.mp3", "safe": 0.339, "sky": "#67aae2", "textTone": "dark"}, {"text": "", "spokenText": "They refill the water tank, hang up their gear and roll the hoses, so they are ready for next time.", "scene": "inside the station: the crew in navy T-shirts rolling up a flat hose, hanging tan coats and helmets on hooks above pairs of boots, and filling Big Red’s tank from a hose; Big Red parked in the bay. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth warm cream-painted station wall", "image": "p16.webp", "audio": "p16.mp3", "safe": 0.016, "sky": "#f8d1a4", "textTone": "dark"}, {"text": "", "spokenText": "Then everyone cooks dinner together in the station kitchen and shares a big pot of yummy soup.", "scene": "the cozy station kitchen in warm evening light: the crew in navy T-shirts sitting around a wooden table sharing bowls of soup from a big pot, smiling and talking; the captain ladling soup. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm smooth soft butter-yellow kitchen wall", "image": "p17.webp", "audio": "p17.mp3", "safe": 0.016, "sky": "#fdcd7c", "textTone": "dark"}, {"text": "", "spokenText": "Goodnight, Big Red. Goodnight, brave crew. Tonight the whole town sleeps safe and cozy, and so do you.", "scene": "night: the red-brick fire station with its bay door open and a warm glow inside, Big Red parked and resting, the station windows softly lit; a quiet town street; cozy and calm, nobody awake outside. Crew: the crew of four friendly firefighters: the captain, a woman with warm deep-brown skin, black curly hair in a low bun, kind brown eyes and a big smile, who wears a white helmet; a tall man with light peachy skin, freckles and a short ginger beard; a young woman with golden-tan skin and a long black braid; and a man with medium-brown skin, short black hair and a neat black mustache; the three crew members wear black helmets. On calls they all wear tan turnout coats and pants with bright yellow reflective stripes, black boots, and silver air tanks on their backs; at the station, with helmets off, they wear plain navy-blue T-shirts and navy work pants. No writing, letters or badges with words on any clothing", "background": "calm deep twilight-blue night sky with tiny soft scattered stars", "image": "p18.webp", "audio": "p18.mp3", "safe": 0.318, "sky": "#011941", "textTone": "light"}], "end": {"text": "The end.", "audio": "end.mp3"}, "layout": "fullbleed"}</script>
