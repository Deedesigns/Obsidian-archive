<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of the Shang dynasty, about 1800 to 1000 BCE (approximate and debated dates)</title>
  <rect width="1200" height="520" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE SHANG DYNASTY · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Dates before about 1250 BCE rest on archaeology and later texts; the start and end of the dynasty are still debated</text>
  <rect x="145.0" y="150" width="286.0" height="26" fill="#7a6a9a55"/>
  <text x="288.0" y="168.0" text-anchor="middle" fill="#f1e6c8" font-size="14">Erlitou culture (Xia? debated)</text>
  <rect x="340.0" y="190" width="720.2" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="700.1" y="210.0" text-anchor="middle" fill="#f1e6c8" font-size="14">Shang dynasty (traditional c. 1600–1046 BCE)</text>
  <rect x="340.0" y="232" width="260.0" height="26" fill="#4a7ec955"/>
  <text x="470.0" y="250.0" text-anchor="middle" fill="#f1e6c8" font-size="14">Erligang: walled city at Zhengzhou</text>
  <rect x="730.0" y="272" width="330.2" height="26" fill="#c96a4a66"/>
  <text x="895.1" y="290.0" text-anchor="middle" fill="#f1e6c8" font-size="14">Late Shang capital at Yinxu (Anyang), c. 1300–1046</text>
  <line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
  <line x1="730.0" y1="300" x2="730.0" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="730.0" cy="330" r="5" fill="#e8c46a"/>
  <text x="730.0" y="388" text-anchor="end" fill="#e8c46a" font-size="14">c. 1300</text>
  <text x="730.0" y="404" text-anchor="end" fill="#d8d2c0" font-size="13">Pan Geng moves the court to Yin</text>
  <line x1="860.0" y1="300" x2="860.0" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="860.0" cy="330" r="5" fill="#e8c46a"/>
  <text x="860.0" y="448" text-anchor="start" fill="#e8c46a" font-size="14">c. 1200</text>
  <text x="860.0" y="464" text-anchor="start" fill="#d8d2c0" font-size="13">Wu Ding reigns; earliest known oracle-bone texts</text>
  <line x1="860.0" y1="300" x2="860.0" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="860.0" cy="330" r="5" fill="#e8c46a"/>
  <text x="860.0" y="484" text-anchor="start" fill="#d8d2c0" font-size="13">Fu Hao buried in tomb M5</text>
  <line x1="1060.2" y1="300" x2="1060.2" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="1060.2" cy="330" r="5" fill="#e8c46a"/>
  <text x="1060.2" y="388" text-anchor="end" fill="#e8c46a" font-size="14">1046 (or c. 1045–1040)</text>
  <text x="1060.2" y="404" text-anchor="end" fill="#d8d2c0" font-size="13">Zhou win at Muye</text>
  <line x1="340.0" y1="300" x2="340.0" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="340.0" cy="330" r="5" fill="#e8c46a"/>
  <text x="340.0" y="448" text-anchor="middle" fill="#e8c46a" font-size="14">c. 1600</text>
  <text x="340.0" y="464" text-anchor="middle" fill="#d8d2c0" font-size="13">Traditional founding by Tang</text>
  <text x="80" y="510" text-anchor="start" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Chronology follows UNESCO and the Xia–Shang–Zhou Chronology Project (2000); alternative dates noted.</text>
</svg>