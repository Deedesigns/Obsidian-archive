<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of the Norte Chico (Caral-Supe) civilization, c. 3500 to 1000 BCE (approximate dates)</title>
  <rect width="1200" height="480" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="479" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">NORTE CHICO · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Calibrated radiocarbon ranges and rounded estimates; dates differ between research teams</text>
  <text x="80" y="92" fill="#8f8a7c" font-size="12" font-style="italic">Huaura, Supe, Pativilca and Fortaleza valleys</text>
  <rect x="288.0" y="100" width="499.20000000000005" height="34" fill="#c9a54a66" stroke="#c9a54a"/>
  <text x="537.6" y="122" text-anchor="middle" fill="#f1e6c8" font-size="13">Late Archaic (Late Preceramic) centres, c. 3000–1800 BCE</text>
  <rect x="443.2" y="146" width="270.4" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="721.6" y="162" fill="#f1e6c8" font-size="13">Caral: dates published in 2001, c. 2627–1977 BCE</text>
  <rect x="464.8" y="176" width="45.8" height="22" fill="#8f8a7c55" stroke="#e8c46a"/>
  <text x="456.8" y="192" text-anchor="end" fill="#f1e6c8" font-size="13">Egypt: Giza pyramids built, c. 2575–2465 BCE</text>
  <rect x="756.0" y="206" width="93.6" height="22" fill="#c9a54a14" stroke="#e8c46a" stroke-dasharray="5 4"/>
  <text x="748.0" y="222" text-anchor="end" fill="#f1e6c8" font-size="13">Temple centres fall out of use, c. 1875–1650 BCE</text>
  <rect x="787.2" y="236" width="124.8" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="920.0" y="252" fill="#f1e6c8" font-size="13">Vichama and Peñico occupied, c. 1800–1500 BCE</text>
  <text x="1120" y="282" text-anchor="end" fill="#bdb6a3" font-size="12" font-style="italic">Chavín culture, from c. 1000 BCE →</text>
  <line x1="80" y1="300" x2="1120" y2="300" stroke="#c9a54a" stroke-width="1.5"/>
  <line x1="80.0" y1="294" x2="80.0" y2="306" stroke="#c9a54a"/>
  <text x="80.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">3500 BCE</text>
  <line x1="288.0" y1="294" x2="288.0" y2="306" stroke="#c9a54a"/>
  <text x="288.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">3000 BCE</text>
  <line x1="496.0" y1="294" x2="496.0" y2="306" stroke="#c9a54a"/>
  <text x="496.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">2500 BCE</text>
  <line x1="704.0" y1="294" x2="704.0" y2="306" stroke="#c9a54a"/>
  <text x="704.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">2000 BCE</text>
  <line x1="912.0" y1="294" x2="912.0" y2="306" stroke="#c9a54a"/>
  <text x="912.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">1500 BCE</text>
  <line x1="1120.0" y1="294" x2="1120.0" y2="306" stroke="#c9a54a"/>
  <text x="1120.0" y="324" text-anchor="middle" fill="#bdb6a3" font-size="13">1000 BCE</text>
  <line x1="600.0" y1="306" x2="600.0" y2="348" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="600.0" cy="300" r="4" fill="#e8c46a"/>
  <text x="594.0" y="360" text-anchor="end" fill="#f1e6c8" font-size="13">c. 2250 BCE: Staff God gourd (radiocarbon date)</text>
  <line x1="620.8" y1="306" x2="620.8" y2="372" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="620.8" cy="300" r="4" fill="#e8c46a"/>
  <text x="626.8" y="384" text-anchor="start" fill="#f1e6c8" font-size="13">c. 2200 BCE: drought proposed by Shady's team (2025)</text>
  <line x1="787.2" y1="306" x2="787.2" y2="406" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="787.2" cy="300" r="4" fill="#e8c46a"/>
  <text x="781.2" y="418" text-anchor="end" fill="#f1e6c8" font-size="13">c. 1800 BCE: earthquakes, El Niño floods and sand (hypothesis)</text>
  <text x="1180" y="468" text-anchor="end" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
