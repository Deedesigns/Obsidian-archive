<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of Nan Madol, about the 1st century CE to the present (approximate dates; some from oral tradition)</title>
<rect width="1200" height="570" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="569" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">NAN MADOL · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Coral dates are precise; dates marked * come from oral tradition and are approximate</text>
<rect x="678.6" y="150" width="227.3" height="28" fill="#c9a54a55" stroke="#e8c46a55"/><text x="792.3" y="169" text-anchor="middle" fill="#f1e6c8" font-size="14">Saudeleur period at Nan Madol</text>
<rect x="905.9" y="190" width="97.4" height="28" fill="#4a7ec955" stroke="#e8c46a55"/><text x="954.6" y="209" text-anchor="middle" fill="#f1e6c8" font-size="12">Nahnmwarki</text>
<rect x="688.8" y="232" width="152.2" height="28" fill="#c96a4a66" stroke="#e8c46a55"/><text x="764.9" y="251" text-anchor="middle" fill="#f1e6c8" font-size="12">Main building (UNESCO)</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
<text x="80.5" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1 CE</text>
<text x="333.7" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">500 CE</text>
<text x="587.3" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1000 CE</text>
<text x="841.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1500 CE</text>
<text x="1094.6" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">2000 CE</text>
<line x1="110.4" y1="330" x2="110.4" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="110.4" cy="330" r="5" fill="#e8c46a"/><text x="110.4" y="388" text-anchor="start" fill="#e8c46a" font-size="14">1st c. CE</text><text x="110.4" y="404" text-anchor="start" fill="#d8d2c0" font-size="13">First people on Pohnpei; earliest reef fill</text>
<line x1="668.5" y1="330" x2="668.5" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="668.5" cy="330" r="5" fill="#e8c46a"/><text x="668.5" y="388" text-anchor="end" fill="#e8c46a" font-size="14">c. 1160*</text><text x="668.5" y="404" text-anchor="end" fill="#d8d2c0" font-size="13">Saudeleur rule begins</text>
<line x1="683.7" y1="330" x2="683.7" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="683.7" cy="330" r="5" fill="#e8c46a"/><text x="683.7" y="448" text-anchor="start" fill="#e8c46a" font-size="14">c. 1180–1200</text><text x="683.7" y="464" text-anchor="start" fill="#d8d2c0" font-size="13">Nandauwas tomb built</text>
<line x1="905.9" y1="330" x2="905.9" y2="480" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="905.9" cy="330" r="5" fill="#e8c46a"/><text x="905.9" y="498" text-anchor="middle" fill="#e8c46a" font-size="14">1628*</text><text x="905.9" y="514" text-anchor="middle" fill="#d8d2c0" font-size="13">Isokelekel overthrows the Saudeleur</text>
<line x1="1003.3" y1="330" x2="1003.3" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="1003.3" cy="330" r="5" fill="#e8c46a"/><text x="1003.3" y="448" text-anchor="middle" fill="#e8c46a" font-size="14">18th c.–1820s</text><text x="1003.3" y="464" text-anchor="middle" fill="#d8d2c0" font-size="13">Nan Madol abandoned</text>
<line x1="1102.8" y1="330" x2="1102.8" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="1102.8" cy="330" r="5" fill="#e8c46a"/><text x="1102.8" y="388" text-anchor="end" fill="#e8c46a" font-size="14">2016</text><text x="1102.8" y="404" text-anchor="end" fill="#d8d2c0" font-size="13">World Heritage, and in Danger</text>
<text x="80" y="555" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Dates follow the sources cited in the article; bars show broad periods, not firm boundaries.</text></svg>