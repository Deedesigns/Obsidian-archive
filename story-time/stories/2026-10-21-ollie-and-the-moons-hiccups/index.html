<script id="story" type="application/json">{"title": "Ollie Otter and the Moon's Hiccups", "date": "2026-10-21", "cover": {"text": "Ollie Otter and the Moon's Hiccups.", "image": "cover.webp", "audio": "cover.mp3", "scene": "Ollie floats happily on his back in a calm sparkly river at twilight, smiling up at a big round friendly full moon with a sleepy cute face that is mid-hiccup; stars, reeds, lily pads, fireflies"}, "pages": [{"text": "Down by the sparkly river lived a little otter named Ollie. Ollie loved splashing, giggling, and floating on his back to look up at the sky.", "image": "p01.webp", "audio": "p01.mp3", "scene": "bright sunny afternoon at a sparkly blue river; Ollie splashes and giggles, floating on his back looking up at fluffy clouds"}, {"text": "One night, Ollie was floating and yawning when he heard a funny sound. \"Hic!\" Up in the sky, the big round moon jiggled. \"Hic! Hic!\"", "image": "p02.webp", "audio": "p02.mp3", "scene": "night on the river; Ollie floats on his back mid-yawn and looks up surprised at the big round moon with a cute face jiggling with a hiccup"}, {"text": "\"Oh no,\" said Ollie. \"The moon has the hiccups! How will she ever fall asleep?\"", "image": "p03.webp", "audio": "p03.mp3", "scene": "Ollie sits on a river rock at night, paws on his cheeks, looking worried up at the moon who has the hiccups"}, {"text": "Frog hopped onto a lily pad. \"Try holding your breath!\" he croaked. The moon puffed up her cheeks, and held it, and held it. \"Hic!\"", "image": "p04.webp", "audio": "p04.mp3", "scene": "a cheerful little green frog on a lily pad next to Ollie, both watching the moon puff up its cheeks holding its breath"}, {"text": "Owl fluttered down from her tree. \"Try drinking a sip of water upside down!\" she hooted. The moon tried, but she only made a splash. \"Hic!\"", "image": "p05.webp", "audio": "p05.mp3", "scene": "a fluffy brown owl flutters down from a tree beside Ollie; the moon tips upside down making a silly splash of sparkly water drops"}, {"text": "Little Mouse squeaked, \"Let's make silly faces!\" So everyone crossed their eyes and wiggled their noses. The moon laughed so hard she wobbled. \"Hic!\"", "image": "p06.webp", "audio": "p06.mp3", "scene": "Ollie, a tiny gray mouse, the frog and the owl make silly faces on the riverbank; the moon laughs so hard it wobbles"}, {"text": "Ollie thought and thought. \"When I can't sleep,\" he said softly, \"Mama sings me a song and gives me a cozy hug.\"", "image": "p07.webp", "audio": "p07.mp3", "scene": "Ollie sits thinking on a mossy log, paw on chin, a dreamy thought bubble shows a mama otter hugging a baby otter; friends watch hopefully"}, {"text": "So all the friends sang a soft, sleepy lullaby. And Ollie floated over to the moon's shiny reflection in the water and gave it the gentlest hug.", "image": "p08.webp", "audio": "p08.mp3", "scene": "Ollie floats and gently hugs the glowing reflection of the moon on the water, eyes closed; friends sing on the bank with little music notes"}, {"text": "The moon smiled a sleepy, silvery smile. She waited, and waited. No more hiccups! \"Thank you, Ollie,\" she whispered.", "image": "p09.webp", "audio": "p09.mp3", "scene": "the moon smiles a sleepy silvery smile; Ollie looks up delighted, friends cheering quietly on the bank"}, {"text": "Ollie curled up in his cozy nest by the river. The moon glowed softly over him, and Ollie drifted off to sleep. Goodnight, Ollie. Goodnight, moon.", "image": "p10.webp", "audio": "p10.mp3", "scene": "Ollie curled up fast asleep in a cozy nest of leaves and moss by the riverbank; the moon with a sleeping face glows softly above"}], "end": {"text": "The end. Sweet dreams!", "audio": "end.mp3"}}</script>
