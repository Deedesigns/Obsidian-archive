<script id="story" type="application/json">{"title": "The Little Raccoon and Baby's First Halloween", "date": "2026-10-30", "cover": {"text": "The Little Raccoon and Baby's First Halloween.", "image": "cover.webp", "audio": "cover.mp3"}, "pages": [{"text": "", "spokenText": "It was Halloween night. A little raccoon buttoned his red firefighter coat and put on his shiny red helmet.", "image": "p01.webp", "audio": "p01.mp3", "safe": 0.4, "sky": "#0f2941", "textTone": "light"}, {"text": "", "spokenText": "Baby wiggled in the little red wagon, dressed as a round orange pumpkin. It was Baby’s very first Halloween!", "image": "p02.webp", "audio": "p02.mp3", "safe": 0.4, "sky": "#0f2942", "textTone": "light"}, {"text": "", "spokenText": "“Raccoons are lucky,” Mama laughed. “We already wear masks!” The little raccoon giggled and touched his black stripe.", "image": "p03.webp", "audio": "p03.mp3", "safe": 0.4, "sky": "#112b42", "textTone": "light"}, {"text": "", "spokenText": "Papa knelt down. “Big brother, will you be Baby’s helper tonight?” The little raccoon stood up tall. “I will!”", "image": "p04.webp", "audio": "p04.mp3", "safe": 0.4, "sky": "#0a2641", "textTone": "light"}, {"text": "", "spokenText": "Outside, friendly pumpkins glowed. He wanted to zoom like a fire truck, but he walked slowly beside Baby’s wagon.", "image": "p05.webp", "audio": "p05.mp3", "safe": 0.4, "sky": "#00203f", "textTone": "light"}, {"text": "", "spokenText": "“Trick or treat, please!” said the little raccoon. The badger witch smiled. “Thank you!” he said, and Baby clapped.", "image": "p06.webp", "audio": "p06.mp3", "safe": 0.4, "sky": "#031f36", "textTone": "light"}, {"text": "", "spokenText": "At the next house, the door opened very, very slowly. Creak! The little raccoon took a deep breath and waited.", "image": "p07.webp", "audio": "p07.mp3", "safe": 0.4, "sky": "#0b243a", "textTone": "light"}, {"text": "", "spokenText": "An old turtle peeked out and smiled. She gave them each a shiny red apple. Waiting was worth it!", "image": "p08.webp", "audio": "p08.mp3", "safe": 0.4, "sky": "#0a253a", "textTone": "light"}, {"text": "", "spokenText": "A bunny astronaut, a fox pirate and a hedgehog dragon all wanted to go first. “You go ahead,” he said.", "image": "p09.webp", "audio": "p09.mp3", "safe": 0.4, "sky": "#01203c", "textTone": "light"}, {"text": "", "spokenText": "“Taking turns is fair,” said the little raccoon. The hedgehog grinned. “Thank you! Next time, you go first!”", "image": "p10.webp", "audio": "p10.mp3", "safe": 0.4, "sky": "#02213b", "textTone": "light"}, {"text": "", "spokenText": "A kind grandma mouse held out her bowl. Baby dropped a candy. Plop! Big brother helped it in. Plink!", "image": "p11.webp", "audio": "p11.mp3", "safe": 0.4, "sky": "#021f37", "textTone": "light"}, {"text": "", "spokenText": "Soon the buckets were full. “Baby can’t eat chewy candy yet,” said the little raccoon. “Baby needs more teeth!”", "image": "p12.webp", "audio": "p12.mp3", "safe": 0.4, "sky": "#062136", "textTone": "light"}, {"text": "", "spokenText": "Then he remembered the soft banana in his pocket. He shared a tiny piece, and Baby squealed with delight.", "image": "p13.webp", "audio": "p13.mp3", "safe": 0.4, "sky": "#02223b", "textTone": "light"}, {"text": "", "spokenText": "Everyone cooed over Baby, and the little raccoon felt left out. Then Papa hugged him. “You’re a wonderful big brother!”", "image": "p14.webp", "audio": "p14.mp3", "safe": 0.4, "sky": "#0b2138", "textTone": "light"}, {"text": "", "spokenText": "Baby gave a big, wobbly yawn. “May I pull the wagon home?” asked big brother. “Yes, thank you,” said Mama.", "image": "p15.webp", "audio": "p15.mp3", "safe": 0.4, "sky": "#042642", "textTone": "light"}, {"text": "", "spokenText": "At home, everyone put on cozy pajamas. The little raccoon counted candy, and Baby nibbled the last banana.", "image": "p16.webp", "audio": "p16.mp3", "safe": 0.4, "sky": "#042240", "textTone": "light"}, {"text": "", "spokenText": "Papa tucked him into bed. “You were patient, kind and helpful tonight,” he whispered. “We’re so proud of you.”", "image": "p17.webp", "audio": "p17.mp3", "safe": 0.4, "sky": "#0b2540", "textTone": "light"}, {"text": "", "spokenText": "Across the room, Baby was already dreaming. “Happy first Halloween, Baby,” he whispered, and closed his eyes.", "image": "p18.webp", "audio": "p18.mp3", "safe": 0.4, "sky": "#082543", "textTone": "light"}], "end": {"text": "The end.", "audio": "end.mp3"}, "layout": "fullbleed"}</script>
