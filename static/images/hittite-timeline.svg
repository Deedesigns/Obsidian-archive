<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of Hittite history, c. 1650 to 717 BCE (approximate dates)</title>
  <rect width="1200" height="380" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="379" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE HITTITES · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">All dates BCE and approximate; Bronze Age chronology is debated by decades</text>
  <!-- scale: 1700 BCE at x=60, 700 BCE at x=1140 => 1.08 px/yr -->
  <rect x="114" y="168" width="248" height="22" fill="#c9a54a33" stroke="#c9a54a"/>
  <text x="238" y="184" text-anchor="middle" fill="#e8c46a" font-size="13">Old Kingdom</text>
  <rect x="362" y="168" width="81" height="22" fill="#c9a54a1a" stroke="#c9a54a88" stroke-dasharray="4 3"/>
  <text x="402" y="184" text-anchor="middle" fill="#bdb6a3" font-size="12">“Middle”?</text>
  <rect x="443" y="168" width="221" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="553" y="184" text-anchor="middle" fill="#f1e6c8" font-size="13">Empire (New Kingdom)</text>
  <rect x="664" y="168" width="508" height="22" fill="#8f8a7c22" stroke="#8f8a7c" />
  <text x="918" y="184" text-anchor="middle" fill="#bdb6a3" font-size="13">Neo-Hittite / Syro-Hittite kingdoms</text>
  <line x1="60" y1="210" x2="1140" y2="210" stroke="#c9a54a" stroke-width="1.5"/>
  <g fill="#8f8a7c" font-size="13" text-anchor="middle">
    <line x1="60" y1="205" x2="60" y2="215" stroke="#c9a54a"/><text x="60" y="232">1700</text>
    <line x1="276" y1="205" x2="276" y2="215" stroke="#c9a54a"/><text x="276" y="232">1500</text>
    <line x1="492" y1="205" x2="492" y2="215" stroke="#c9a54a"/><text x="492" y="232">1300</text>
    <line x1="708" y1="205" x2="708" y2="215" stroke="#c9a54a"/><text x="708" y="232">1100</text>
    <line x1="924" y1="205" x2="924" y2="215" stroke="#c9a54a"/><text x="924" y="232">900</text>
    <line x1="1140" y1="205" x2="1140" y2="215" stroke="#c9a54a"/><text x="1140" y="232">700</text>
  </g>
  <g font-size="13" fill="#e9e2cf">
    <g transform="translate(114,0)"><line y1="150" y2="168" stroke="#e8c46a"/><rect x="-5" y="140" width="10" height="10" transform="rotate(45 0 145)" fill="#e8c46a"/><text y="128" text-anchor="middle">c. 1650 Hattusili I</text><text y="110" text-anchor="middle" fill="#8f8a7c" font-size="12">Hattusa capital</text></g>
    <g transform="translate(173,0)"><line y1="190" y2="262" stroke="#e8c46a"/><rect x="-5" y="262" width="10" height="10" transform="rotate(45 0 267)" fill="#e8c46a"/><text y="292" text-anchor="middle">c. 1595 Sack of Babylon</text><text y="310" text-anchor="middle" fill="#8f8a7c" font-size="12">Mursili I (date debated)</text></g>
    <g transform="translate(443,0)"><line y1="150" y2="168" stroke="#e8c46a"/><rect x="-5" y="140" width="10" height="10" transform="rotate(45 0 145)" fill="#e8c46a"/><text y="128" text-anchor="middle">c. 1350–1322</text><text y="110" text-anchor="middle" fill="#8f8a7c" font-size="12">Suppiluliuma I</text></g>
    <g transform="translate(518,0)"><line y1="190" y2="262" stroke="#e8c46a"/><rect x="-5" y="262" width="10" height="10" transform="rotate(45 0 267)" fill="#e8c46a"/><text y="292" text-anchor="middle">c. 1274 Battle of Kadesh</text></g>
    <g transform="translate(535,0)"><line y1="190" y2="322" stroke="#e8c46a"/><rect x="-5" y="322" width="10" height="10" transform="rotate(45 0 327)" fill="#e8c46a"/><text y="352" text-anchor="middle">c. 1259 Peace treaty with Egypt</text></g>
    <g transform="translate(664,0)"><line y1="150" y2="168" stroke="#e8c46a"/><rect x="-5" y="140" width="10" height="10" transform="rotate(45 0 145)" fill="#e8c46a"/><text y="128" text-anchor="middle">c. 1200–1180</text><text y="110" text-anchor="middle" fill="#8f8a7c" font-size="12">Hattusa abandoned</text></g>
    <g transform="translate(1129,0)"><line y1="190" y2="262" stroke="#e8c46a"/><rect x="-5" y="262" width="10" height="10" transform="rotate(45 0 267)" fill="#e8c46a"/><text y="292" text-anchor="end" x="10">717 Assyria takes Carchemish</text></g>
  </g>
  <text x="1185" y="370" text-anchor="end" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
