<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of Great Zimbabwe, c. 1000 to 1986 CE (approximate dates)</title>
  <rect width="1200" height="420" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">GREAT ZIMBABWE · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">All dates CE; occupation dates are approximate and still being revised by new radiocarbon studies</text>
  <!-- scale: 1000 CE at x=60, 2000 CE at x=1140 => 1.08 px/yr -->
  <rect x="114" y="150" width="270" height="22" fill="#c9a54a33" stroke="#c9a54a"/>
  <text x="249" y="166" text-anchor="middle" fill="#e8c46a" font-size="13">Hill Complex (c. 1050–1300)</text>
  <rect x="330" y="176" width="216" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="438" y="192" text-anchor="middle" fill="#f1e6c8" font-size="13">Great Enclosure (c. 1250–1450)</text>
  <rect x="384" y="202" width="270" height="22" fill="#8f8a7c22" stroke="#8f8a7c"/>
  <text x="519" y="218" text-anchor="middle" fill="#bdb6a3" font-size="13">Valley Complex (c. 1300–1550)</text>
  <line x1="60" y1="240" x2="1140" y2="240" stroke="#c9a54a" stroke-width="1.5"/>
  <g fill="#8f8a7c" font-size="13" text-anchor="middle">
    <line x1="60" y1="235" x2="60" y2="245" stroke="#c9a54a"/><text x="60" y="262">1000</text>
    <line x1="276" y1="235" x2="276" y2="245" stroke="#c9a54a"/><text x="276" y="262">1200</text>
    <line x1="492" y1="235" x2="492" y2="245" stroke="#c9a54a"/><text x="492" y="262">1400</text>
    <line x1="708" y1="235" x2="708" y2="245" stroke="#c9a54a"/><text x="708" y="262">1600</text>
    <line x1="924" y1="235" x2="924" y2="245" stroke="#c9a54a"/><text x="924" y="262">1800</text>
    <line x1="1140" y1="235" x2="1140" y2="245" stroke="#c9a54a"/><text x="1140" y="262">2000</text>
  </g>
  <g font-size="13" fill="#e9e2cf">
    <g transform="translate(70,0)"><line y1="132" y2="150" stroke="#e8c46a"/><rect x="-5" y="122" width="10" height="10" transform="rotate(45 0 127)" fill="#e8c46a"/><text y="110" x="-10" text-anchor="start">c. 1000 Farming settlement</text><text y="92" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">first stone walls on the hill later</text></g>
    <g transform="translate(384,0)"><line y1="132" y2="150" stroke="#e8c46a"/><rect x="-5" y="122" width="10" height="10" transform="rotate(45 0 127)" fill="#e8c46a"/><text y="110" text-anchor="middle">c. 1300 Regional capital</text><text y="92" text-anchor="middle" fill="#8f8a7c" font-size="12">as Mapungubwe declines</text></g>
    <g transform="translate(600,0)"><line y1="132" y2="202" stroke="#e8c46a"/><rect x="-5" y="122" width="10" height="10" transform="rotate(45 0 127)" fill="#e8c46a"/><text y="110" text-anchor="middle">c. 1450–1500 Decline</text><text y="92" text-anchor="middle" fill="#8f8a7c" font-size="12">power shifts to Mutapa and Torwa</text></g>
    <g transform="translate(633,0)"><line y1="245" y2="292" stroke="#e8c46a"/><rect x="-5" y="292" width="10" height="10" transform="rotate(45 0 297)" fill="#e8c46a"/><text y="322" text-anchor="middle">1531 Portuguese report "Symbaoe"</text></g>
    <g transform="translate(1001,0)"><line y1="245" y2="292" stroke="#e8c46a"/><rect x="-5" y="292" width="10" height="10" transform="rotate(45 0 297)" fill="#e8c46a"/><text y="322" text-anchor="middle">1871 Karl Mauch visits</text></g>
    <g transform="translate(1091,0)"><line y1="245" y2="342" stroke="#e8c46a"/><rect x="-5" y="342" width="10" height="10" transform="rotate(45 0 347)" fill="#e8c46a"/><text y="372" x="-14" text-anchor="end">1929 Caton-Thompson confirms African builders</text></g>
    <g transform="translate(1118,0)"><line y1="245" y2="380" stroke="#e8c46a"/><rect x="-5" y="380" width="10" height="10" transform="rotate(45 0 385)" fill="#e8c46a"/><text y="395" x="-14" text-anchor="end">1980 Zimbabwe takes its name · 1986 UNESCO listing</text></g>
  </g>
  <text x="15" y="410" text-anchor="start" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
