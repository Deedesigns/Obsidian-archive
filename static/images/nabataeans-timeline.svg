<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of the Nabataeans and Petra, about 400 BCE to 500 CE (approximate dates)</title>
  <rect width="1200" height="470" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE NABATAEANS AND PETRA · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Early dates are rounded; the dating of individual monuments is still debated</text>
  <rect x="210.0" y="215" width="457.2" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="438.6" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Nabataean kingdom</text>
  <rect x="667.2" y="215" width="346.8" height="30" fill="#c9a54a33" stroke="#e8c46a"/>
  <text x="840.6" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Roman province of Arabia</text>
  <rect x="1014.0" y="215" width="126.0" height="30" fill="#8f8a7c22" stroke="#e8c46a" stroke-dasharray="5 4"/>
  <text x="1077.0" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Byzantine Petra</text>
  <rect x="504.0" y="209" width="84.0" height="42" fill="none" stroke="#f1e6c8" stroke-width="2"/>
  <line x1="60" y1="255" x2="1140" y2="255" stroke="#c9a54a"/>
  <text x="60.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">400 BCE</text>
  <text x="180.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">300 BCE</text>
  <text x="300.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">200 BCE</text>
  <text x="420.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">100 BCE</text>
  <text x="540.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">1 CE</text>
  <text x="660.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">100 CE</text>
  <text x="780.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">200 CE</text>
  <text x="900.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">300 CE</text>
  <text x="1020.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">400 CE</text>
  <text x="1140.0" y="272" text-anchor="middle" fill="#8f8a7c" font-size="11">500 CE</text>
  <g transform="translate(60.0,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 400 BCE earliest remains</text><text y="343" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">radiocarbon dates, downtown Petra</text></g>
  <g transform="translate(165.6,0)"><line y1="165" y2="215" stroke="#e8c46a"/><rect x="-5" y="155" width="10" height="10" transform="rotate(45 0 160)" fill="#e8c46a"/><text y="143" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">312/311 BCE Athenaeus raids</text><text y="127" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">"the rock" (Diodorus)</text></g>
  <g transform="translate(338.4,0)"><line y1="255" y2="365" stroke="#e8c46a"/><rect x="-5" y="365" width="10" height="10" transform="rotate(45 0 370)" fill="#e8c46a"/><text y="395" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">168 BCE</text><text y="413" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">Petra a seat of Nabataean power</text></g>
  <g transform="translate(546.0,0)"><line y1="125" y2="215" stroke="#e8c46a"/><rect x="-5" y="115" width="10" height="10" transform="rotate(45 0 120)" fill="#e8c46a"/><text y="103" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">30 BCE–40 CE peak of Petra</text><text y="87" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">Obodas and Aretas IV; the Khazneh carved</text></g>
  <g transform="translate(667.2,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">106 CE Trajan annexes</text><text y="343" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">after death of Rabbel II</text></g>
  <g transform="translate(860.4,0)"><line y1="165" y2="215" stroke="#e8c46a"/><rect x="-5" y="155" width="10" height="10" transform="rotate(45 0 160)" fill="#e8c46a"/><text y="143" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">267 CE Raqush inscription</text><text y="127" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">Arabic in Nabataean letters, Hegra</text></g>
  <g transform="translate(975.6,0)"><line y1="255" y2="365" stroke="#e8c46a"/><rect x="-5" y="365" width="10" height="10" transform="rotate(45 0 370)" fill="#e8c46a"/><text y="395" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">363 CE earthquake</text><text y="413" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">followed by another in 418</text></g>
  <g transform="translate(1075.2,0)"><line y1="125" y2="215" stroke="#e8c46a"/><rect x="-5" y="115" width="10" height="10" transform="rotate(45 0 120)" fill="#e8c46a"/><text y="103" x="10" text-anchor="end" fill="#e9e2cf" font-size="13">446 CE Urn Tomb</text><text y="87" x="10" text-anchor="end" fill="#8f8a7c" font-size="12">rededicated as a church</text></g>
  <text x="15" y="460" text-anchor="start" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
