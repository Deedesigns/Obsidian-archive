<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of Akhenaten's religious revolution and its aftermath, c. 1353 to 1250 BCE (approximate dates)</title>
  <rect width="1200" height="500" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="499" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">AKHENATEN'S REVOLUTION · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Regnal years follow the boundary stelae; BCE dates are approximate and vary between chronologies</text>

  <!-- era bands: scale x = 80 + (1355 - year) * 10 -->
  <rect x="100" y="92" width="170" height="36" fill="#c9a54a88" stroke="#c9a54a"/>
  <text x="185" y="115" text-anchor="middle" fill="#f1e6c8" font-size="13">Reign of Akhenaten</text>
  <rect x="270" y="92" width="130" height="36" fill="#c9a54a44" stroke="#c9a54a"/>
  <text x="335" y="115" text-anchor="middle" fill="#f1e6c8" font-size="12">Successors · restoration</text>
  <rect x="400" y="92" width="720" height="36" fill="#8f8a7c33" stroke="#c9a54a"/>
  <text x="760" y="115" text-anchor="middle" fill="#f1e6c8" font-size="13">Horemheb and the Ramesside kings · the Amarna kings erased</text>

  <!-- axis -->
  <line x1="80" y1="170" x2="1120" y2="170" stroke="#c9a54a" stroke-width="2"/>
  <g fill="#8f8a7c" font-size="13" text-anchor="middle">
    <line x1="100" y1="164" x2="100" y2="176" stroke="#c9a54a"/><text x="100" y="192">1353</text>
    <line x1="230" y1="164" x2="230" y2="176" stroke="#c9a54a"/><text x="230" y="192">1340</text>
    <line x1="380" y1="164" x2="380" y2="176" stroke="#c9a54a"/><text x="380" y="192">1325</text>
    <line x1="580" y1="164" x2="580" y2="176" stroke="#c9a54a"/><text x="580" y="192">1305</text>
    <line x1="780" y1="164" x2="780" y2="176" stroke="#c9a54a"/><text x="780" y="192">1285</text>
    <line x1="980" y1="164" x2="980" y2="176" stroke="#c9a54a"/><text x="980" y="192">1265</text>
    <text x="1120" y="192">BCE</text>
  </g>

  <!-- leader lines -->
  <g>
    <line x1="100" y1="176" x2="100" y2="230" stroke="#c9a54a77"/>
    <line x1="140" y1="176" x2="140" y2="320" stroke="#c9a54a77"/>
    <line x1="170" y1="176" x2="170" y2="410" stroke="#c9a54a77"/>
    <line x1="270" y1="176" x2="330" y2="230" stroke="#c9a54a77"/>
    <line x1="320" y1="176" x2="430" y2="320" stroke="#c9a54a77"/>
    <line x1="430" y1="176" x2="640" y2="230" stroke="#c9a54a77"/>
    <line x1="700" y1="176" x2="760" y2="320" stroke="#c9a54a77"/>
    <line x1="900" y1="176" x2="900" y2="410" stroke="#c9a54a77"/>
  </g>
  <!-- events -->
  <g font-size="13" fill="#f1e6c8">
    <circle cx="100" cy="170" r="6" fill="#c9a54a"/>
    <rect x="87" y="235" width="155" height="57" fill="#0d1424"/>
    <text x="92" y="250">c. 1353 · Amenhotep IV</text>
    <text x="92" y="268" fill="#8f8a7c">crowned; Aten temples</text>
    <text x="92" y="286" fill="#8f8a7c">built at Karnak</text>

    <circle cx="140" cy="170" r="6" fill="#c9a54a"/>
    <rect x="127" y="325" width="188" height="57" fill="#0d1424"/>
    <text x="132" y="340">Year 5 · renamed Akhenaten;</text>
    <text x="132" y="358" fill="#8f8a7c">first proclamation founds</text>
    <text x="132" y="376" fill="#8f8a7c">Akhetaten (Amarna)</text>

    <circle cx="170" cy="170" r="6" fill="#c9a54a"/>
    <rect x="157" y="415" width="182" height="57" fill="#0d1424"/>
    <text x="162" y="430">Years 6 and 8 · boundaries</text>
    <text x="162" y="448" fill="#8f8a7c">fixed and reaffirmed;</text>
    <text x="162" y="466" fill="#8f8a7c">Amun later erased</text>

    <circle cx="270" cy="170" r="6" fill="#c9a54a"/>
    <rect x="325" y="235" width="168" height="39" fill="#0d1424"/>
    <text x="330" y="250">c. 1336 · Akhenaten dies</text>
    <text x="330" y="268" fill="#8f8a7c">after about 17 years</text>

    <circle cx="320" cy="170" r="6" fill="#c9a54a"/>
    <rect x="425" y="325" width="221" height="57" fill="#0d1424"/>
    <text x="430" y="340">Tutankhaten becomes Tutankhamun;</text>
    <text x="430" y="358" fill="#8f8a7c">court leaves Amarna; Restoration</text>
    <text x="430" y="376" fill="#8f8a7c">Stela reopens the old temples</text>

    <circle cx="430" cy="170" r="6" fill="#c9a54a"/>
    <rect x="635" y="235" width="241" height="39" fill="#0d1424"/>
    <text x="640" y="250">Horemheb · Aten temples dismantled,</text>
    <text x="640" y="268" fill="#8f8a7c">talatat blocks reused as fill</text>

    <circle cx="700" cy="170" r="6" fill="#c9a54a"/>
    <rect x="755" y="325" width="215" height="39" fill="#0d1424"/>
    <text x="760" y="340">Seti I · Abydos king list skips</text>
    <text x="760" y="358" fill="#8f8a7c">from Amenhotep III to Horemheb</text>

    <circle cx="900" cy="170" r="6" fill="#c9a54a"/>
    <rect x="887" y="415" width="208" height="57" fill="#0d1424"/>
    <text x="892" y="430">Ramesses II · Mose's tomb text</text>
    <text x="892" y="448" fill="#8f8a7c">recalls "the time of the</text>
    <text x="892" y="466" fill="#8f8a7c">enemy of Akhetaten"</text>
  </g>
</svg>
