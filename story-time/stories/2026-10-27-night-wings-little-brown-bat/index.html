<script id="story" type="application/json">{"title": "Night Wings: The True Story of a Little Brown Bat", "date": "2026-10-27", "cover": {"text": "Night Wings: The True Story of a Little Brown Bat.", "image": "cover.webp", "audio": "cover.mp3"}, "pages": [{"text": "", "spokenText": "In an old barn, a tiny brown bat hangs upside down. She weighs about as much as three pennies!", "image": "p01.webp", "audio": "p01.mp3", "safe": 0.4, "sky": "#5d3d26", "textTone": "light"}, {"text": "", "spokenText": "Special cords in her feet lock her toes tight, so hanging is easy. At sunset, she wakes up.", "image": "p02.webp", "audio": "p02.mp3", "safe": 0.4, "sky": "#372517", "textTone": "light"}, {"text": "", "spokenText": "Bats sleep about twenty hours a day! She yawns, stretches, and combs her fur clean like a cat.", "image": "p03.webp", "audio": "p03.mp3", "safe": 0.4, "sky": "#63452d", "textTone": "light"}, {"text": "", "spokenText": "Bats are not birds. They are mammals with fur, and baby bats, called pups, drink their mother's milk.", "image": "p04.webp", "audio": "p04.mp3", "safe": 0.4, "sky": "#63462f", "textTone": "light"}, {"text": "", "spokenText": "She lets go, drops into the air, and flies! Bats are the only mammals that can truly fly.", "image": "p05.webp", "audio": "p05.mp3", "safe": 0.4, "sky": "#394180", "textTone": "light"}, {"text": "", "spokenText": "Her wings are really her hands, with long finger bones. Bats' scientific name even means hand-wing!", "image": "p06.webp", "audio": "p06.mp3", "safe": 0.4, "sky": "#44467a", "textTone": "light"}, {"text": "", "spokenText": "Other little brown bats zig and zag out of the barn too. When you go to bed, it's their breakfast time!", "image": "p07.webp", "audio": "p07.mp3", "safe": 0.4, "sky": "#394180", "textTone": "light"}, {"text": "", "spokenText": "How does she find bugs in the dark? She calls out squeaks too high for us to hear.", "image": "p08.webp", "audio": "p08.mp3", "safe": 0.4, "sky": "#012a6c", "textTone": "light"}, {"text": "", "spokenText": "The squeaks bounce off a moth as echoes, which tell her where it is. This is called echolocation!", "image": "p09.webp", "audio": "p09.mp3", "safe": 0.4, "sky": "#042c69", "textTone": "light"}, {"text": "", "spokenText": "She scoops up the moth with her wing. She can catch hundreds of bugs in one hour!", "image": "p10.webp", "audio": "p10.mp3", "safe": 0.4, "sky": "#042b6c", "textTone": "light"}, {"text": "", "spokenText": "Down at the pond, she skims the still water and takes a sip while she flies.", "image": "p11.webp", "audio": "p11.mp3", "safe": 0.4, "sky": "#05317a", "textTone": "light"}, {"text": "", "spokenText": "Eating bugs helps farmers and means fewer mosquito bites! Far away, fruit bats spread seeds and pollen for plants.", "image": "p12.webp", "audio": "p12.mp3", "safe": 0.4, "sky": "#022a6a", "textTone": "light"}, {"text": "", "spokenText": "All night she eats and rests. When the sky turns pink at dawn, she flies home to the barn.", "image": "p13.webp", "audio": "p13.mp3", "safe": 0.4, "sky": "#656693", "textTone": "light"}, {"text": "", "spokenText": "As autumn nights grow cold, she eats and eats. Her extra fat is like a packed lunch for winter.", "image": "p14.webp", "audio": "p14.mp3", "safe": 0.4, "sky": "#2b3968", "textTone": "light"}, {"text": "", "spokenText": "One chilly night, she flies to a big, quiet cave in the hills, where many bats gather.", "image": "p15.webp", "audio": "p15.mp3", "safe": 0.4, "sky": "#022b6f", "textTone": "light"}, {"text": "", "spokenText": "Inside the cave it is dark and damp, not freezing and not warm, but just right.", "image": "p16.webp", "audio": "p16.mp3", "safe": 0.4, "sky": "#3e4659", "textTone": "light"}, {"text": "", "spokenText": "She hooks her toes on the rock, wraps her wings like a blanket, and begins to hibernate.", "image": "p17.webp", "audio": "p17.mp3", "safe": 0.4, "sky": "#383d43", "textTone": "light"}, {"text": "", "spokenText": "Her body cools and her racing heart slows way, way down. She will sleep almost all winter.", "image": "p18.webp", "audio": "p18.mp3", "safe": 0.4, "sky": "#36414b", "textTone": "light"}, {"text": "", "spokenText": "Outside, snow falls softly over the hills. Inside, the little brown bat dreams, upside down and cozy.", "image": "p19.webp", "audio": "p19.mp3", "safe": 0.4, "sky": "#333945", "textTone": "light"}, {"text": "", "spokenText": "In spring, she will fly into the evening sky again. But for now, goodnight, little bat.", "image": "p20.webp", "audio": "p20.mp3", "safe": 0.4, "sky": "#1f2126", "textTone": "light"}], "end": {"text": "The end. Goodnight, little bat, and sweet dreams!", "audio": "end.mp3"}, "layout": "fullbleed"}</script>
