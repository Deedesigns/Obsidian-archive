<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of the Roman cult of Mithras, about 67 BCE to 400 CE (approximate dates)</title>
<rect width="1200" height="520" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE MYSTERIES OF MITHRAS · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Dates are rounded; dashed entries are disputed as evidence for the Roman cult</text>
<rect x="146.0" y="100" width="6.0" height="22" fill="#c9a54a22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="162.0" y="116" text-anchor="start" fill="#f1e6c8" font-size="14">Plutarch: Cilician pirates' 'secret rites' of Mithras (67 BCE)</text>
<rect x="180.0" y="140" width="200.0" height="22" fill="#c9a54a22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="390.0" y="156" text-anchor="start" fill="#f1e6c8" font-size="14">Kerch plaques: a bull-killer, perhaps Mithras (c. 50 BCE–50 CE)</text>
<rect x="440.0" y="180" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="456.0" y="196" text-anchor="start" fill="#f1e6c8" font-size="14">Statius pictures Mithras in a 'Persian cave' (c. 80 CE)</text>
<rect x="440.0" y="220" width="80.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="530.0" y="236" text-anchor="start" fill="#f1e6c8" font-size="14">earliest dedications and mithraea, Rome and the frontiers (c. 80–120)</text>
<rect x="560.0" y="260" width="220.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="550.0" y="276" text-anchor="end" fill="#f1e6c8" font-size="14">rapid spread; hundreds of dedications (mid-2nd to 3rd century)</text>
<rect x="760.0" y="300" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="750.0" y="316" text-anchor="end" fill="#f1e6c8" font-size="14">London's Walbrook mithraeum built (c. 240)</text>
<rect x="896.0" y="340" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="886.0" y="356" text-anchor="end" fill="#f1e6c8" font-size="14">Carnuntum altar to Mithras, 'patron of their empire' (c. 307–308)</text>
<rect x="904.0" y="380" width="176.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="894.0" y="396" text-anchor="end" fill="#f1e6c8" font-size="14">decline under Christian emperors; last temples end (4th century)</text>
<line x1="80" y1="440" x2="1120" y2="440" stroke="#e8c46a" stroke-width="2"/>
<line x1="80.0" y1="434" x2="80.0" y2="446" stroke="#e8c46a"/>
<text x="80.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">100 BCE</text>
<line x1="180.0" y1="434" x2="180.0" y2="446" stroke="#e8c46a"/>
<text x="180.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">50 BCE</text>
<line x1="280.0" y1="434" x2="280.0" y2="446" stroke="#e8c46a"/>
<text x="280.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">0</text>
<line x1="380.0" y1="434" x2="380.0" y2="446" stroke="#e8c46a"/>
<text x="380.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">50 CE</text>
<line x1="480.0" y1="434" x2="480.0" y2="446" stroke="#e8c46a"/>
<text x="480.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">100 CE</text>
<line x1="580.0" y1="434" x2="580.0" y2="446" stroke="#e8c46a"/>
<text x="580.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">150 CE</text>
<line x1="680.0" y1="434" x2="680.0" y2="446" stroke="#e8c46a"/>
<text x="680.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">200 CE</text>
<line x1="780.0" y1="434" x2="780.0" y2="446" stroke="#e8c46a"/>
<text x="780.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">250 CE</text>
<line x1="880.0" y1="434" x2="880.0" y2="446" stroke="#e8c46a"/>
<text x="880.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">300 CE</text>
<line x1="980.0" y1="434" x2="980.0" y2="446" stroke="#e8c46a"/>
<text x="980.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">350 CE</text>
<line x1="1080.0" y1="434" x2="1080.0" y2="446" stroke="#e8c46a"/>
<text x="1080.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">400 CE</text>
<text x="1180" y="500" text-anchor="end" fill="#8f8a7c" font-size="12" font-style="italic">Diagram: Obsidian Archive</text>
</svg>