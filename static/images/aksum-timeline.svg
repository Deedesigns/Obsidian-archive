<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of Aksum and its predecessors, about 800 BCE to 1000 CE (approximate and debated dates)</title>
<rect width="1200" height="570" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="569" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">AKSUM · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Early dates rest on archaeology and foreign texts; the start and end of the kingdom are both debated</text>
<rect x="80.0" y="150" width="288.9" height="28" fill="#7a6a9a55" stroke="#e8c46a55"/><text x="224.5" y="169" text-anchor="middle" fill="#f1e6c8" font-size="14">Pre-Aksumite: Yeha and D'mt</text>
<rect x="571.1" y="190" width="375.6" height="28" fill="#c9a54a55" stroke="#e8c46a55"/><text x="758.9" y="209" text-anchor="middle" fill="#f1e6c8" font-size="14">Kingdom of Aksum at its height</text>
<rect x="698.2" y="232" width="208.1" height="28" fill="#4a7ec955" stroke="#e8c46a55"/><text x="802.3" y="251" text-anchor="middle" fill="#f1e6c8" font-size="14">Aksumite coinage</text>
<rect x="738.7" y="272" width="381.3" height="28" fill="#c96a4a66" stroke="#e8c46a55"/><text x="929.4" y="291" text-anchor="middle" fill="#f1e6c8" font-size="14">Christian kingdom (from c. 340)</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
<text x="195.6" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">600 BCE</text>
<text x="369.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">300 BCE</text>
<text x="542.2" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1 CE</text>
<text x="715.6" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">300 CE</text>
<text x="888.9" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">600 CE</text>
<text x="1062.2" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">900 CE</text>
<line x1="137.8" y1="330" x2="137.8" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="137.8" cy="330" r="5" fill="#e8c46a"/><text x="137.8" y="388" text-anchor="start" fill="#e8c46a" font-size="14">c. 700 BCE</text><text x="137.8" y="404" text-anchor="start" fill="#d8d2c0" font-size="13">Great Temple at Yeha</text>
<line x1="571.1" y1="330" x2="571.1" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="571.1" cy="330" r="5" fill="#e8c46a"/><text x="571.1" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">mid-1st c. CE</text><text x="571.1" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">Periplus names Adulis and Aksum</text>
<line x1="698.2" y1="330" x2="698.2" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="698.2" cy="330" r="5" fill="#e8c46a"/><text x="698.2" y="448" text-anchor="end" fill="#e8c46a" font-size="14">c. 270</text><text x="698.2" y="464" text-anchor="end" fill="#d8d2c0" font-size="13">First coins (Endubis)</text>
<line x1="738.7" y1="330" x2="738.7" y2="480" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="738.7" cy="330" r="5" fill="#e8c46a"/><text x="738.7" y="498" text-anchor="middle" fill="#e8c46a" font-size="14">330s–350s (debated)</text><text x="738.7" y="514" text-anchor="middle" fill="#d8d2c0" font-size="13">Ezana turns to Christianity</text>
<line x1="845.6" y1="330" x2="845.6" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="845.6" cy="330" r="5" fill="#e8c46a"/><text x="845.6" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">525</text><text x="845.6" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">Kaleb invades Himyar</text>
<line x1="1062.2" y1="330" x2="1062.2" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="1062.2" cy="330" r="5" fill="#e8c46a"/><text x="1062.2" y="448" text-anchor="end" fill="#e8c46a" font-size="14">7th–10th c.</text><text x="1062.2" y="464" text-anchor="end" fill="#d8d2c0" font-size="13">Gradual political decline</text>
<text x="80" y="555" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Dates follow the sources cited in the article and are approximate; bars show broad periods, not firm boundaries.</text></svg>
