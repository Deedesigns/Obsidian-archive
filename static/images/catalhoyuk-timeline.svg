<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of Çatalhöyük, about 7500 to 5000 BCE, with modern research milestones (approximate dates)</title>
<rect width="1200" height="520" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">ÇATALHÖYÜK · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">All prehistoric dates are calibrated radiocarbon estimates and differ between studies</text>
<rect x="112.4" y="130" width="127.2" height="30" fill="#8f8a7c22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="176.0" y="150" text-anchor="middle" fill="#f1e6c8" font-size="14">UNESCO start</text>
<rect x="239.6" y="130" width="487.6" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
<text x="483.4" y="150" text-anchor="middle" fill="#f1e6c8" font-size="14">East Mound (Neolithic), about 7100–5950 BCE</text>
<rect x="409.2" y="175" width="84.8" height="30" fill="#c9a54a88" stroke="#e8c46a"/>
<text x="451.6" y="195" text-anchor="middle" fill="#f1e6c8" font-size="14"></text>
<rect x="706.0" y="220" width="212.0" height="30" fill="#c9a54a33" stroke="#e8c46a"/>
<text x="812.0" y="240" text-anchor="middle" fill="#f1e6c8" font-size="14">West Mound (Chalcolithic)</text>
<rect x="918.0" y="220" width="127.2" height="30" fill="#8f8a7c22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="981.6" y="240" text-anchor="middle" fill="#f1e6c8" font-size="14">to 5200?</text>
<line x1="70" y1="290" x2="1130" y2="290" stroke="#c9a54a"/><line x1="70.0" y1="285" x2="70.0" y2="295" stroke="#c9a54a"/><text x="70.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">7500 BCE</text><line x1="282.0" y1="285" x2="282.0" y2="295" stroke="#c9a54a"/><text x="282.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">7000 BCE</text><line x1="494.0" y1="285" x2="494.0" y2="295" stroke="#c9a54a"/><text x="494.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">6500 BCE</text><line x1="706.0" y1="285" x2="706.0" y2="295" stroke="#c9a54a"/><text x="706.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">6000 BCE</text><line x1="918.0" y1="285" x2="918.0" y2="295" stroke="#c9a54a"/><text x="918.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">5500 BCE</text><line x1="1130.0" y1="285" x2="1130.0" y2="295" stroke="#c9a54a"/><text x="1130.0" y="312" text-anchor="middle" fill="#8f8a7c" font-size="13">5000 BCE</text>
<line x1="299.0" y1="290" x2="299.0" y2="331" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="299.0" cy="290" r="5" fill="#e8c46a"/><text x="307.0" y="345" fill="#f1e6c8" font-size="14">Hasan Dağı eruption, 6960 ± 640 BCE (pumice dating)</text>
<line x1="451.6" y1="290" x2="451.6" y2="361" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="451.6" cy="290" r="5" fill="#e8c46a"/><text x="459.6" y="375" fill="#f1e6c8" font-size="14">“Volcano” or “leopard skin” mural, Level VII</text>
<line x1="494.0" y1="290" x2="494.0" y2="391" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="494.0" cy="290" r="5" fill="#e8c46a"/><text x="502.0" y="405" fill="#f1e6c8" font-size="14">Late Period begins: population declines and disperses</text>
<line x1="70" y1="440" x2="1130" y2="440" stroke="#c9a54a55"/>
<text x="600" y="464" text-anchor="middle" fill="#c9a54a" font-size="15" letter-spacing="2">MODERN RESEARCH</text>
<text x="600" y="494" text-anchor="middle" fill="#f1e6c8" font-size="15">1958 site identified · 1961–65 Mellaart digs · 1993–2018 Çatalhöyük Research Project · 2012 UNESCO listing · 2025 ancient-DNA kinship study</text>
<text x="502.0" y="195" fill="#f1e6c8" font-size="14">Middle Period peak, roughly 3,500–8,000 people</text>
</svg>