<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of Ugarit, about 1450 to 1185 BCE, and its rediscovery from 1928 (approximate dates)</title>
<rect width="1200" height="560" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">UGARIT · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Ancient dates are rounded; the scribe Ilimilku's date is disputed (two bars)</text>
<text x="80" y="100" fill="#e8c46a" font-size="16" letter-spacing="2">THE KINGDOM (BCE)</text>
<rect x="228.6" y="120" width="787.4" height="20" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="238.6" y="135" fill="#f1e6c8" font-size="13">golden age of the port kingdom (c. 1450–1185)</text>
<rect x="377.1" y="148" width="624.0" height="20" fill="#c9a54a30" stroke="#e8c46a"/>
<text x="387.1" y="163" fill="#f1e6c8" font-size="13">Ugaritic alphabet in use (from c. 1400 or 1300)</text>
<rect x="525.7" y="176" width="490.3" height="20" fill="#c9a54a30" stroke="#e8c46a"/>
<text x="535.7" y="191" fill="#f1e6c8" font-size="13">vassal of the Hittite empire (c. 1350 onward)</text>
<rect x="496.0" y="204" width="118.9" height="20" fill="#8f8a7c22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="622.9" y="219" fill="#f1e6c8" font-size="13">Ilimilku: older dating (mid-1300s)</text>
<rect x="852.6" y="232" width="118.9" height="20" fill="#8f8a7c22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="979.4" y="247" fill="#f1e6c8" font-size="13">Ilimilku: later dating (late 1200s)</text>
<line x1="80" y1="280" x2="1120" y2="280" stroke="#c9a54a" stroke-width="2"/>
<line x1="80.0" y1="274" x2="80.0" y2="286" stroke="#c9a54a"/><text x="80.0" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1500</text>
<line x1="228.6" y1="274" x2="228.6" y2="286" stroke="#c9a54a"/><text x="228.6" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1450</text>
<line x1="377.1" y1="274" x2="377.1" y2="286" stroke="#c9a54a"/><text x="377.1" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1400</text>
<line x1="525.7" y1="274" x2="525.7" y2="286" stroke="#c9a54a"/><text x="525.7" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1350</text>
<line x1="674.3" y1="274" x2="674.3" y2="286" stroke="#c9a54a"/><text x="674.3" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1300</text>
<line x1="822.9" y1="274" x2="822.9" y2="286" stroke="#c9a54a"/><text x="822.9" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1250</text>
<line x1="971.4" y1="274" x2="971.4" y2="286" stroke="#c9a54a"/><text x="971.4" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1200</text>
<line x1="1120.0" y1="274" x2="1120.0" y2="286" stroke="#c9a54a"/><text x="1120.0" y="304" text-anchor="middle" fill="#8f8a7c" font-size="13">1150</text>
<circle cx="1016.0" cy="280" r="6" fill="#e05a3a"/><text x="1016.0" y="322" text-anchor="middle" fill="#f1e6c8" font-size="13">destroyed c. 1185</text>
<text x="80" y="350" fill="#e8c46a" font-size="16" letter-spacing="2">THE REDISCOVERY (CE)</text>
<line x1="80" y1="440" x2="1120" y2="440" stroke="#c9a54a" stroke-width="2"/>
<line x1="80.0" y1="434" x2="80.0" y2="446" stroke="#c9a54a"/><text x="80.0" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1920</text>
<line x1="174.5" y1="434" x2="174.5" y2="446" stroke="#c9a54a"/><text x="174.5" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1930</text>
<line x1="269.1" y1="434" x2="269.1" y2="446" stroke="#c9a54a"/><text x="269.1" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1940</text>
<line x1="363.6" y1="434" x2="363.6" y2="446" stroke="#c9a54a"/><text x="363.6" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1950</text>
<line x1="458.2" y1="434" x2="458.2" y2="446" stroke="#c9a54a"/><text x="458.2" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1960</text>
<line x1="552.7" y1="434" x2="552.7" y2="446" stroke="#c9a54a"/><text x="552.7" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1970</text>
<line x1="647.3" y1="434" x2="647.3" y2="446" stroke="#c9a54a"/><text x="647.3" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1980</text>
<line x1="741.8" y1="434" x2="741.8" y2="446" stroke="#c9a54a"/><text x="741.8" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">1990</text>
<line x1="836.4" y1="434" x2="836.4" y2="446" stroke="#c9a54a"/><text x="836.4" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">2000</text>
<line x1="930.9" y1="434" x2="930.9" y2="446" stroke="#c9a54a"/><text x="930.9" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">2010</text>
<line x1="1025.5" y1="434" x2="1025.5" y2="446" stroke="#c9a54a"/><text x="1025.5" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">2020</text>
<line x1="1120.0" y1="434" x2="1120.0" y2="446" stroke="#c9a54a"/><text x="1120.0" y="464" text-anchor="middle" fill="#8f8a7c" font-size="13">2030</text>
<line x1="155.6" y1="440" x2="155.6" y2="414" stroke="#c9a54a88"/><circle cx="155.6" cy="440" r="5" fill="#e8c46a"/><text x="161.6" y="410" text-anchor="start" fill="#f1e6c8" font-size="13">1928 plough opens a tomb</text>
<line x1="165.1" y1="440" x2="165.1" y2="392" stroke="#c9a54a88"/><circle cx="165.1" cy="440" r="5" fill="#e8c46a"/><text x="171.1" y="388" text-anchor="start" fill="#f1e6c8" font-size="13">1929 Schaeffer's dig and first tablets</text>
<line x1="193.5" y1="440" x2="193.5" y2="370" stroke="#c9a54a88"/><circle cx="193.5" cy="440" r="5" fill="#e8c46a"/><text x="199.5" y="366" text-anchor="start" fill="#f1e6c8" font-size="13">1932 Baal stele found</text>
<line x1="779.6" y1="440" x2="779.6" y2="414" stroke="#c9a54a88"/><circle cx="779.6" cy="440" r="5" fill="#e8c46a"/><text x="773.6" y="410" text-anchor="end" fill="#f1e6c8" font-size="13">1994 Ilimilku letter found</text>
<line x1="940.4" y1="440" x2="940.4" y2="392" stroke="#c9a54a88"/><circle cx="940.4" cy="440" r="5" fill="#e8c46a"/><text x="934.4" y="388" text-anchor="end" fill="#f1e6c8" font-size="13">2011 fieldwork halted</text>
<line x1="1072.7" y1="440" x2="1072.7" y2="370" stroke="#c9a54a88"/><circle cx="1072.7" cy="440" r="5" fill="#e8c46a"/><text x="1066.7" y="366" text-anchor="end" fill="#f1e6c8" font-size="13">2025 work resumes nearby</text>
<text x="1120" y="540" text-anchor="end" fill="#8f8a7c" font-size="12" font-style="italic">Diagram: Obsidian Archive</text>
</svg>