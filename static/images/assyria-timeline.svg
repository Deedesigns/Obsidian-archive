<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of the Neo-Assyrian Empire, about 950 to 600 BCE (approximate dates)</title>
  <rect width="1200" height="520" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE NEO-ASSYRIAN EMPIRE · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Royal dates follow Assyrian king lists and eponym lists; the climate bands follow Sinha et al. (2019) and are debated</text>
  <rect x="154.3" y="280" width="594.3" height="22" fill="#4a7ec955"/>
  <text x="451.4" y="296" text-anchor="middle" fill="#d8d2c0" font-size="13">Unusually wet centuries (c. 925–725)</text>
  <rect x="897.1" y="280" width="222.9" height="22" fill="#c96a4a55"/>
  <text x="1008.6" y="296" text-anchor="middle" fill="#d8d2c0" font-size="13">Drought decades begin (c. 675 onward)</text>
  <rect x="192.9" y="245" width="900.3" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="643.1" y="265" text-anchor="middle" fill="#f1e6c8" font-size="15">Neo-Assyrian Empire (c. 912–609 BCE)</text>
  <line x1="60" y1="320" x2="1140" y2="320" stroke="#8f8a7c"/>
  <line x1="291.0" y1="226" x2="291.0" y2="245" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="291.0" cy="245" r="4" fill="#e8c46a"/>
  <text x="291.0" y="190" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">879</text>
  <text x="291.0" y="206" text-anchor="middle" fill="#f1e6c8" font-size="13">Kalhu (Nimrud) palace</text>
  <text x="291.0" y="221" text-anchor="middle" fill="#bdb6a3" font-size="13">feast for 69,574 guests</text>
  <line x1="689.1" y1="181" x2="689.1" y2="245" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="689.1" cy="245" r="4" fill="#e8c46a"/>
  <text x="689.1" y="145" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">745–727</text>
  <text x="689.1" y="161" text-anchor="middle" fill="#f1e6c8" font-size="13">Tiglath-pileser III:</text>
  <text x="689.1" y="176" text-anchor="middle" fill="#bdb6a3" font-size="13">mass deportations</text>
  <line x1="772.3" y1="320" x2="772.3" y2="364" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="772.3" cy="320" r="4" fill="#e8c46a"/>
  <text x="772.3" y="380" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">c. 717</text>
  <text x="772.3" y="396" text-anchor="middle" fill="#f1e6c8" font-size="13">Sargon II begins</text>
  <text x="772.3" y="411" text-anchor="middle" fill="#bdb6a3" font-size="13">Dur-Sharrukin</text>
  <line x1="819.9" y1="226" x2="819.9" y2="245" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="819.9" cy="245" r="4" fill="#e8c46a"/>
  <text x="819.9" y="190" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">701</text>
  <text x="819.9" y="206" text-anchor="middle" fill="#f1e6c8" font-size="13">Siege of Lachish</text>
  <text x="819.9" y="221" text-anchor="middle" fill="#bdb6a3" font-size="13">(Judah)</text>
  <line x1="909.0" y1="320" x2="909.0" y2="414" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="909.0" cy="320" r="4" fill="#e8c46a"/>
  <text x="909.0" y="430" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">671</text>
  <text x="909.0" y="446" text-anchor="middle" fill="#f1e6c8" font-size="13">Esarhaddon takes</text>
  <text x="909.0" y="461" text-anchor="middle" fill="#bdb6a3" font-size="13">Memphis in Egypt</text>
  <line x1="915.0" y1="136" x2="915.0" y2="245" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="915.0" cy="245" r="4" fill="#e8c46a"/>
  <text x="915.0" y="100" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">669–c. 631</text>
  <text x="915.0" y="116" text-anchor="middle" fill="#f1e6c8" font-size="13">Ashurbanipal;</text>
  <text x="915.0" y="131" text-anchor="middle" fill="#bdb6a3" font-size="13">library at Nineveh</text>
  <line x1="1078.4" y1="320" x2="1078.4" y2="364" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="1078.4" cy="320" r="4" fill="#e8c46a"/>
  <text x="1086.4" y="380" text-anchor="end" fill="#e8c46a" font-size="14" font-weight="bold">614</text>
  <text x="1086.4" y="396" text-anchor="end" fill="#f1e6c8" font-size="13">Medes sack</text>
  <text x="1086.4" y="411" text-anchor="end" fill="#bdb6a3" font-size="13">Ashur</text>
  <line x1="1084.3" y1="226" x2="1084.3" y2="245" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="1084.3" cy="245" r="4" fill="#e8c46a"/>
  <text x="1084.3" y="190" text-anchor="middle" fill="#e8c46a" font-size="14" font-weight="bold">612</text>
  <text x="1084.3" y="206" text-anchor="middle" fill="#f1e6c8" font-size="13">Fall of</text>
  <text x="1084.3" y="221" text-anchor="middle" fill="#bdb6a3" font-size="13">Nineveh</text>
  <line x1="1093.3" y1="320" x2="1093.3" y2="464" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="1093.3" cy="320" r="4" fill="#e8c46a"/>
  <text x="1101.3" y="480" text-anchor="end" fill="#e8c46a" font-size="14" font-weight="bold">609</text>
  <text x="1101.3" y="496" text-anchor="end" fill="#f1e6c8" font-size="13">Harran lost;</text>
  <text x="1101.3" y="511" text-anchor="end" fill="#bdb6a3" font-size="13">Assyria vanishes</text>
  <text x="80" y="505" fill="#8f8a7c" font-size="12">Diagram: Obsidian Archive</text>
</svg>