<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of the oracle of Delphi, about 1500 BCE to 400 CE (approximate dates)</title>
<rect width="1200" height="520" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE ORACLE OF DELPHI · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Dates are rounded; the dashed entry rests on later, partly legendary accounts</text>
<rect x="80.0" y="100" width="218.9" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="308.9" y="116" text-anchor="start" fill="#f1e6c8" font-size="14">Mycenaean settlement at Delphi (c. 1500–1100 BCE)</text>
<rect x="463.2" y="140" width="54.7" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="527.9" y="156" text-anchor="start" fill="#f1e6c8" font-size="14">sanctuary and oracle of Apollo take shape (8th century BCE)</text>
<rect x="578.1" y="180" width="6.0" height="22" fill="#c9a54a22" stroke="#e8c46a" stroke-dasharray="5 4"/>
<text x="594.1" y="196" text-anchor="start" fill="#f1e6c8" font-size="14">First Sacred War; Pythian Games reorganised (c. 590–582 BCE)</text>
<rect x="601.1" y="220" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="617.1" y="236" text-anchor="start" fill="#f1e6c8" font-size="14">temple of Apollo burns (548 BCE); rebuilt with Alcmaeonid help</text>
<rect x="638.3" y="260" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="654.3" y="276" text-anchor="start" fill="#f1e6c8" font-size="14">'wooden wall' oracle before the battle of Salamis (480 BCE)</text>
<rect x="696.9" y="300" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="712.9" y="316" text-anchor="start" fill="#f1e6c8" font-size="14">earthquake destroys temple (373 BCE); the surviving temple follows</text>
<rect x="953.1" y="340" width="13.7" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="943.1" y="356" text-anchor="end" fill="#f1e6c8" font-size="14">Plutarch serves as a priest at Delphi (c. 95–120s CE)</text>
<rect x="1114.5" y="380" width="6.0" height="22" fill="#c9a54a40" stroke="#e8c46a"/>
<text x="1104.5" y="396" text-anchor="end" fill="#f1e6c8" font-size="14">Theodosius bans pagan sacrifice; oracle falls silent (390s CE)</text>
<line x1="80" y1="440" x2="1120" y2="440" stroke="#e8c46a" stroke-width="2"/>
<line x1="80.0" y1="434" x2="80.0" y2="446" stroke="#e8c46a"/><text x="80.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">1500 BCE</text>
<line x1="353.7" y1="434" x2="353.7" y2="446" stroke="#e8c46a"/><text x="353.7" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">1000 BCE</text>
<line x1="627.4" y1="434" x2="627.4" y2="446" stroke="#e8c46a"/><text x="627.4" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">500 BCE</text>
<line x1="901.1" y1="434" x2="901.1" y2="446" stroke="#e8c46a"/><text x="901.1" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">1 CE</text>
<line x1="1120.0" y1="434" x2="1120.0" y2="446" stroke="#e8c46a"/><text x="1120.0" y="466" text-anchor="middle" fill="#8f8a7c" font-size="13">400 CE</text>
<text x="1120" y="500" text-anchor="end" fill="#8f8a7c" font-size="12">Diagram: Obsidian Archive</text></svg>