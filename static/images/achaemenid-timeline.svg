<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of major Achaemenid kings, about 559 to 330 BCE (approximate dates)</title>
<rect width="1200" height="560" fill="#0d1424"/>
<rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#c9a54a55"/>
<text x="600" y="38" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">ACHAEMENID EMPIRE · MAJOR KINGS</text>
<text x="600" y="62" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Rough reign dates; some successions and the identity of Bardiya/Gaumata remain debated</text>

<!-- Reign bars: scale 559–330 BCE over x=80..1120 (1040 px for 229 years ≈ 4.541 px/yr) -->
<!-- Cyrus 559-530: 0-29 → 80 to 211.7 -->
<rect x="80" y="120" width="131.7" height="26" fill="#c9a54a55" stroke="#e8c46a66"/>
<text x="145.8" y="138" text-anchor="middle" fill="#f1e6c8" font-size="13">Cyrus II</text>
<!-- Cambyses 530-522: 29-37 → 211.7 to 248 -->
<rect x="211.7" y="120" width="36.3" height="26" fill="#7a6a9a55" stroke="#e8c46a55"/>
<text x="229.9" y="138" text-anchor="middle" fill="#f1e6c8" font-size="11">Cam.</text>
<!-- Darius I 522-486: 37-73 → 248 to 411.5 -->
<rect x="248" y="156" width="163.5" height="26" fill="#4a7ec955" stroke="#e8c46a66"/>
<text x="329.7" y="174" text-anchor="middle" fill="#f1e6c8" font-size="13">Darius I</text>
<!-- Xerxes 486-465: 73-94 → 411.5 to 506.9 -->
<rect x="411.5" y="156" width="95.4" height="26" fill="#c96a4a66" stroke="#e8c46a55"/>
<text x="459.2" y="174" text-anchor="middle" fill="#f1e6c8" font-size="13">Xerxes I</text>
<!-- Artaxerxes I 465-424: 94-135 → 506.9 to 693 -->
<rect x="506.9" y="192" width="186.2" height="26" fill="#7a6a9a55" stroke="#e8c46a55"/>
<text x="600" y="210" text-anchor="middle" fill="#f1e6c8" font-size="13">Artaxerxes I</text>
<!-- Darius II 423-404: 136-155 → 697.6 to 783.9 -->
<rect x="697.6" y="192" width="86.3" height="26" fill="#4a7ec955" stroke="#e8c46a55"/>
<text x="740.7" y="210" text-anchor="middle" fill="#f1e6c8" font-size="12">Darius II</text>
<!-- Artaxerxes II 404-359: 155-200 → 783.9 to 988.2 -->
<rect x="783.9" y="228" width="204.3" height="26" fill="#c9a54a55" stroke="#e8c46a55"/>
<text x="886" y="246" text-anchor="middle" fill="#f1e6c8" font-size="13">Artaxerxes II</text>
<!-- Artaxerxes III 358-338: 201-221 → 992.7 to 1083.6 -->
<rect x="992.7" y="228" width="90.8" height="26" fill="#c96a4a66" stroke="#e8c46a55"/>
<text x="1038.1" y="246" text-anchor="middle" fill="#f1e6c8" font-size="12">Art. III</text>
<!-- Darius III 336-330: 223-229 → 1092.7 to 1120 -->
<rect x="1092.7" y="264" width="27.3" height="26" fill="#4a7ec955" stroke="#e8c46a55"/>
<text x="1106.3" y="282" text-anchor="middle" fill="#f1e6c8" font-size="11">D.III</text>

<line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
<text x="80" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">559 BCE</text>
<text x="329.7" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">500</text>
<text x="557" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">450</text>
<text x="784" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">400</text>
<text x="1011" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">350</text>
<text x="1120" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">330</text>

<!-- Event markers -->
<line x1="120.9" y1="330" x2="120.9" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="120.9" cy="330" r="5" fill="#e8c46a"/>
<text x="120.9" y="388" text-anchor="start" fill="#e8c46a" font-size="13">c. 550</text>
<text x="120.9" y="404" text-anchor="start" fill="#d8d2c0" font-size="12">Defeats Media</text>

<line x1="170.8" y1="330" x2="170.8" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="170.8" cy="330" r="5" fill="#e8c46a"/>
<text x="170.8" y="448" text-anchor="middle" fill="#e8c46a" font-size="13">539</text>
<text x="170.8" y="464" text-anchor="middle" fill="#d8d2c0" font-size="12">Takes Babylon</text>

<line x1="234.4" y1="330" x2="234.4" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="234.4" cy="330" r="5" fill="#e8c46a"/>
<text x="234.4" y="388" text-anchor="middle" fill="#e8c46a" font-size="13">525</text>
<text x="234.4" y="404" text-anchor="middle" fill="#d8d2c0" font-size="12">Egypt falls</text>

<line x1="266.2" y1="330" x2="266.2" y2="480" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="266.2" cy="330" r="5" fill="#e8c46a"/>
<text x="266.2" y="498" text-anchor="start" fill="#e8c46a" font-size="13">c. 518</text>
<text x="266.2" y="514" text-anchor="start" fill="#d8d2c0" font-size="12">Persepolis begun</text>

<line x1="438.7" y1="330" x2="438.7" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="438.7" cy="330" r="5" fill="#e8c46a"/>
<text x="438.7" y="388" text-anchor="middle" fill="#e8c46a" font-size="13">480–479</text>
<text x="438.7" y="404" text-anchor="middle" fill="#d8d2c0" font-size="12">Greek campaign</text>

<line x1="1069.9" y1="330" x2="1069.9" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/>
<circle cx="1069.9" cy="330" r="5" fill="#e8c46a"/>
<text x="1069.9" y="388" text-anchor="end" fill="#e8c46a" font-size="13">334–330</text>
<text x="1069.9" y="404" text-anchor="end" fill="#d8d2c0" font-size="12">Alexander's conquest</text>

<text x="80" y="545" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Dates follow Britannica, Met, Livius and Iranica; bars are approximate reigns, not firm day-counts.</text>
</svg>
