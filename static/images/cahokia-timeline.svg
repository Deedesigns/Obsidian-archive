<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of Cahokia, c. 650 to 1450 CE (approximate dates)</title>
  <rect width="1200" height="470" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">CAHOKIA · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Archaeological phases and key events; all dates are approximate and radiocarbon-based</text>
  <rect x="80" y="96" width="455" height="34" fill="#8f8a7c33" stroke="#c9a54a"/>
  <text x="308" y="118" text-anchor="middle" fill="#f1e6c8" font-size="12">Late Woodland villages</text>
  <rect x="535" y="96" width="65" height="34" fill="#c9a54a33" stroke="#c9a54a"/>
  <text x="568" y="118" text-anchor="middle" fill="#f1e6c8" font-size="10">Emergent</text>
  <rect x="600" y="96" width="65" height="34" fill="#c9a54a88" stroke="#c9a54a"/>
  <text x="632" y="118" text-anchor="middle" fill="#f1e6c8" font-size="10">Lohmann</text>
  <rect x="665" y="96" width="130" height="34" fill="#c9a54a66" stroke="#c9a54a"/>
  <text x="730" y="118" text-anchor="middle" fill="#f1e6c8" font-size="12">Stirling</text>
  <rect x="795" y="96" width="98" height="34" fill="#c9a54a44" stroke="#c9a54a"/>
  <text x="844" y="118" text-anchor="middle" fill="#f1e6c8" font-size="12">Moorehead</text>
  <rect x="892" y="96" width="98" height="34" fill="#8f8a7c44" stroke="#c9a54a"/>
  <text x="941" y="118" text-anchor="middle" fill="#f1e6c8" font-size="12">Sand Prairie</text>
  <text x="80.0" y="88" fill="#8f8a7c" font-size="12" font-style="italic">Phases (American Bottom chronology)</text>
  <rect x="600" y="162" width="130" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="738" y="178" fill="#f1e6c8" font-size="13">Peak population, perhaps 10,000–20,000</text>
  <rect x="535" y="190" width="260" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="803" y="206" fill="#f1e6c8" font-size="13">Mound 72 burials</text>
  <rect x="665" y="218" width="130" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="803" y="234" fill="#f1e6c8" font-size="13">Woodhenge post circles (several rebuilds)</text>
  <rect x="762" y="246" width="130" height="22" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="900" y="262" fill="#f1e6c8" font-size="13">Palisade built and rebuilt four times</text>
  <rect x="795" y="274" width="195" height="22" fill="#c9a54a14" stroke="#c9a54a" stroke-dasharray="5 4"/>
  <text x="785" y="290" text-anchor="end" fill="#f1e6c8" font-size="13">Large Mississippi floods return; city empties</text>
  <line x1="80.0" y1="330" x2="1120.0" y2="330" stroke="#c9a54a" stroke-width="1.5"/>
  <line x1="145" y1="324" x2="145" y2="336" stroke="#c9a54a"/>
  <text x="145" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">700 CE</text>
  <line x1="275" y1="324" x2="275" y2="336" stroke="#c9a54a"/>
  <text x="275" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">800 CE</text>
  <line x1="405" y1="324" x2="405" y2="336" stroke="#c9a54a"/>
  <text x="405" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">900 CE</text>
  <line x1="535" y1="324" x2="535" y2="336" stroke="#c9a54a"/>
  <text x="535" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">1000 CE</text>
  <line x1="665" y1="324" x2="665" y2="336" stroke="#c9a54a"/>
  <text x="665" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">1100 CE</text>
  <line x1="795" y1="324" x2="795" y2="336" stroke="#c9a54a"/>
  <text x="795" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">1200 CE</text>
  <line x1="925" y1="324" x2="925" y2="336" stroke="#c9a54a"/>
  <text x="925" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">1300 CE</text>
  <line x1="1055" y1="324" x2="1055" y2="336" stroke="#c9a54a"/>
  <text x="1055" y="354" text-anchor="middle" fill="#bdb6a3" font-size="13">1400 CE</text>
  <line x1="600" y1="336" x2="600" y2="380" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="600" cy="330" r="4" fill="#e8c46a"/>
  <text x="594" y="392" text-anchor="end" fill="#f1e6c8" font-size="13">c. 1050: rapid rebuilding of the city ("Big Bang")</text>
  <line x1="736" y1="336" x2="736" y2="402" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="736" cy="330" r="4" fill="#e8c46a"/>
  <text x="742" y="414" text-anchor="start" fill="#f1e6c8" font-size="13">c. 1150–1160: major flood; summer rains decline</text>
  <line x1="990" y1="336" x2="990" y2="380" stroke="#e8c46a" stroke-dasharray="2 3"/>
  <circle cx="990" cy="330" r="4" fill="#e8c46a"/>
  <text x="996" y="392" text-anchor="start" fill="#f1e6c8" font-size="13">c. 1350: city largely abandoned</text>
  <text x="1180" y="460" text-anchor="end" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
