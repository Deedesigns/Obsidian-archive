<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Timeline of the Phoenician city-states and Carthage, about 1300 to 146 BCE (approximate and debated dates)</title>
<rect width="1200" height="520" fill="#0d1424"/><rect x="0.5" y="0.5" width="1199" height="519" fill="none" stroke="#c9a54a55"/>
<text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">THE PHOENICIANS · AN APPROXIMATE TIMELINE</text>
<text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">All dates BCE; early dates rest on archaeology and later Greek and Roman writers, and several are still debated</text>
<rect x="80.0" y="150" width="130.0" height="28" fill="#7a6a9a55" stroke="#e8c46a55"/><text x="145.0" y="169" text-anchor="middle" fill="#f1e6c8" font-size="14">Late Bronze Age</text>
<rect x="210.0" y="190" width="708.9" height="28" fill="#c9a54a55" stroke="#e8c46a55"/><text x="564.5" y="209" text-anchor="middle" fill="#f1e6c8" font-size="14">Independent city-kingdoms: Byblos, Sidon, Tyre, Arwad</text>
<rect x="426.7" y="232" width="653.5" height="28" fill="#4a7ec955" stroke="#e8c46a55"/><text x="753.4" y="251" text-anchor="middle" fill="#f1e6c8" font-size="14">Western settlements: Gadir, Sardinia, Carthage (Punic world)</text>
<rect x="452.7" y="272" width="225.3" height="28" fill="#c96a4a66" stroke="#e8c46a55"/><text x="565.3" y="291" text-anchor="middle" fill="#f1e6c8" font-size="14">Paying tribute to Assyria</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#8f8a7c"/>
<text x="166.7" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1200</text>
<text x="340.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">1000</text>
<text x="513.3" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">800</text>
<text x="686.7" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">600</text>
<text x="860.0" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">400</text>
<text x="1033.3" y="320" text-anchor="middle" fill="#8f8a7c" font-size="11">200</text>
<line x1="123.3" y1="330" x2="123.3" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="123.3" cy="330" r="5" fill="#e8c46a"/><text x="123.3" y="388" text-anchor="start" fill="#e8c46a" font-size="14">13th c.</text><text x="123.3" y="404" text-anchor="start" fill="#d8d2c0" font-size="13">Purple dye at Sarepta</text>
<line x1="340.0" y1="330" x2="340.0" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="340.0" cy="330" r="5" fill="#e8c46a"/><text x="340.0" y="448" text-anchor="middle" fill="#e8c46a" font-size="14">c. 1000? (debated)</text><text x="340.0" y="464" text-anchor="middle" fill="#d8d2c0" font-size="13">Ahiram inscription, Byblos</text>
<line x1="501.2" y1="330" x2="501.2" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="501.2" cy="330" r="5" fill="#e8c46a"/><text x="501.2" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">814/813 (trad.)</text><text x="501.2" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">Carthage founded</text>
<line x1="686.7" y1="330" x2="686.7" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="686.7" cy="330" r="5" fill="#e8c46a"/><text x="686.7" y="448" text-anchor="middle" fill="#e8c46a" font-size="14">c. 600</text><text x="686.7" y="464" text-anchor="middle" fill="#d8d2c0" font-size="13">Necho's Africa voyage (Herodotus)</text>
<line x1="918.9" y1="330" x2="918.9" y2="370" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="918.9" cy="330" r="5" fill="#e8c46a"/><text x="918.9" y="388" text-anchor="middle" fill="#e8c46a" font-size="14">332</text><text x="918.9" y="404" text-anchor="middle" fill="#d8d2c0" font-size="13">Alexander takes Tyre</text>
<line x1="1080.1" y1="330" x2="1080.1" y2="430" stroke="#e8c46a" stroke-dasharray="2 3"/><circle cx="1080.1" cy="330" r="5" fill="#e8c46a"/><text x="1080.1" y="448" text-anchor="end" fill="#e8c46a" font-size="14">146</text><text x="1080.1" y="464" text-anchor="end" fill="#d8d2c0" font-size="13">Rome destroys Carthage</text>
<text x="80" y="510" fill="#8f8a7c" font-size="11">Diagram: Obsidian Archive. Dates follow the sources cited in the article; Carthage's foundation date is traditional, supported by radiocarbon dates of about 835–800 BCE.</text></svg>