name: Deploy Pages
on:
  push:
    branches: [main]
    # Audio commits are produced by this workflow. Ignoring them, together with
    # the [skip ci] trailer, keeps that push from starting another run.
    paths-ignore:
      - "audio/**"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Kokoro models
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-model-files-v1.0
      - name: Narrate new and edited articles
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python3 -m pip install "kokoro-onnx==0.6.1"
          python3 narrate.py
      - name: Commit narration
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No narration changes to commit"
            exit 0
          fi
          git commit -m "Add article narration [skip ci]"
          git push origin HEAD:main || {
            echo "Push rejected; rebasing onto main and retrying once"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          }
      - run: python3 build.py
      # Story Time is already-built static files in story-time/. build.py
      # wipes public/ and only emits the history site, so copy the folder in
      # afterwards. Do not run story-time/narrate.py or story-time/build.py
      # here; article narration stays on content/*.md via the root narrate.py.
      - name: Include Story Time in the Pages artifact
        run: |
          if [ -d story-time ]; then
            cp -a story-time public/story-time
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4
