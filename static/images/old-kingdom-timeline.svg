<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Palatino Linotype, Palatino, Georgia, serif">
  <title>Timeline of Egypt's Old Kingdom, about 2700 to 2150 BCE (approximate dates)</title>
  <rect width="1200" height="470" fill="#0d1424"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#c9a54a55"/>
  <text x="600" y="40" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">EGYPT'S OLD KINGDOM · AN APPROXIMATE TIMELINE</text>
  <text x="600" y="64" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Dates follow the widely used "consensus" chronology (Shaw 2000); other schemes shift them by decades</text>
  <rect x="87.5" y="215" width="143.3" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="159.2" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Dynasty 3</text>
  <rect x="230.8" y="215" width="233.7" height="30" fill="#c9a54a33" stroke="#e8c46a"/>
  <text x="347.6" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Dynasty 4</text>
  <rect x="464.5" y="215" width="292.6" height="30" fill="#c9a54a55" stroke="#e8c46a"/>
  <text x="610.8" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Dynasty 5</text>
  <rect x="757.1" y="215" width="322.0" height="30" fill="#c9a54a33" stroke="#e8c46a"/>
  <text x="918.1" y="235" text-anchor="middle" fill="#f1e6c8" font-size="14">Dynasty 6</text>
  <rect x="1079.1" y="215" width="60.9" height="30" fill="#8f8a7c22" stroke="#8f8a7c" stroke-dasharray="5 4"/>
  <text x="1109.5" y="227" text-anchor="middle" fill="#bdb6a3" font-size="10">First</text><text x="1109.5" y="240" text-anchor="middle" fill="#bdb6a3" font-size="10">Intermediate</text>
  <g fill="#bdb6a3" font-size="12" text-anchor="middle">
    <line x1="60" y1="255" x2="1140" y2="255" stroke="#c9a54a"/>
  </g>
  <g transform="translate(124.8,0)"><line y1="167" y2="215" stroke="#e8c46a"/><rect x="-5" y="157" width="10" height="10" transform="rotate(45 0 162)" fill="#e8c46a"/><text y="145" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 2667–2648 Djoser</text><text y="129" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">Step Pyramid at Saqqara</text></g>
  <g transform="translate(278.0,0)"><line y1="132" y2="215" stroke="#e8c46a"/><rect x="-5" y="122" width="10" height="10" transform="rotate(45 0 127)" fill="#e8c46a"/><text y="110" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">c. 2589–2566 Khufu</text><text y="94" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">Great Pyramid at Giza</text></g>
  <g transform="translate(323.1,0)"><line y1="179" y2="215" stroke="#e8c46a"/><rect x="-5" y="169" width="10" height="10" transform="rotate(45 0 174)" fill="#e8c46a"/><text y="157" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 2566 Diary of Merer</text><text y="141" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">boat logs from late in Khufu's reign</text></g>
  <g transform="translate(698.2,0)"><line y1="167" y2="215" stroke="#e8c46a"/><rect x="-5" y="157" width="10" height="10" transform="rotate(45 0 162)" fill="#e8c46a"/><text y="145" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">c. 2375–2345 Unas</text><text y="129" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">first Pyramid Texts</text></g>
  <g transform="translate(888.7,0)"><line y1="132" y2="215" stroke="#e8c46a"/><rect x="-5" y="122" width="10" height="10" transform="rotate(45 0 127)" fill="#e8c46a"/><text y="110" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">c. 2278–2184 Pepy II</text><text y="94" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">reign length debated</text></g>
  <g transform="translate(230.8,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 2613–2589 Sneferu</text><text y="343" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">Meidum, Bent and Red Pyramids</text></g>
  <g transform="translate(364.4,0)"><line y1="255" y2="367" stroke="#e8c46a"/><rect x="-5" y="367" width="10" height="10" transform="rotate(45 0 372)" fill="#e8c46a"/><text y="397" x="-10" text-anchor="start" fill="#e9e2cf" font-size="13">c. 2558–2503 Khafre, Menkaure</text><text y="415" x="-10" text-anchor="start" fill="#8f8a7c" font-size="12">Giza's second and third pyramids</text></g>
  <g transform="translate(550.9,0)"><line y1="255" y2="295" stroke="#e8c46a"/><rect x="-5" y="295" width="10" height="10" transform="rotate(45 0 300)" fill="#e8c46a"/><text y="325" x="0" text-anchor="middle" fill="#e9e2cf" font-size="13">5th Dynasty sun temples</text><text y="343" x="0" text-anchor="middle" fill="#8f8a7c" font-size="12">at Abusir and Abu Gurab</text></g>
  <g transform="translate(1041.8,0)"><line y1="255" y2="350" stroke="#e8c46a"/><rect x="-5" y="350" width="10" height="10" transform="rotate(45 0 355)" fill="#e8c46a"/><text y="380" x="14" text-anchor="end" fill="#e9e2cf" font-size="13">by c. 2200: radiocarbon date for</text><text y="398" x="14" text-anchor="end" fill="#8f8a7c" font-size="12">death of Pepy II's official Djau</text></g>
  <text x="15" y="460" text-anchor="start" fill="#8f8a7c" font-size="11" font-style="italic">Diagram: Obsidian Archive</text>
</svg>
