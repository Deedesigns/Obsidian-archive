<script id="story" type="application/json">{"title": "The Little Astronaut and the Moon Rover Rescue", "date": "2026-11-01", "cover": {"text": "The Little Astronaut and the Moon Rover Rescue.", "image": "cover.webp", "audio": "cover.mp3", "scene": "the little astronaut and Pebble standing together proudly on the gray moon surface next to the orange rocket, the blue and white Earth glowing in the black-indigo sky behind them; adventurous, happy; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings. This cover has NO title and NO words anywhere"}, "pages": [{"text": "", "spokenText": "At the edge of a sleepy seaside town, a little astronaut checked her shiny orange rocket one last time.", "scene": "a tall rounded tangerine-orange rocket with three fins and round windows stands on a small launch pad on a grassy hill by the sea at dusk; the little astronaut, small in the scene, stands at its base holding a clipboard, looking up proudly; a few cozy cottages with lit windows and a little lighthouse far below", "background": "calm deep blue-violet dusk sky", "image": "p01.webp", "audio": "p01.mp3", "safe": 0.375, "sky": "#1b2657", "textTone": "light"}, {"text": "", "spokenText": "Far away on the Moon, her robot friend Pebble had stopped sending his happy beeps.", "scene": "inside a cozy round control room with a big round window, the little astronaut leans toward a glowing teal screen showing a tiny picture of Pebble on a gray moon crater; her helmet rests on the desk beside her; a small desk lamp; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "plain smooth dusky teal upper wall", "image": "p02.webp", "audio": "p02.mp3", "safe": 0.438, "sky": "#177f7b", "textTone": "light"}, {"text": "", "spokenText": "She zipped her puffy suit, clicked on her helmet, and packed her toolbox. \"Ready for liftoff!\" she called.", "scene": "the little astronaut on the launch pad gantry walkway next to the rocket door, wearing her bubble helmet, holding up a red metal toolbox with a big smile, giving a thumbs-up", "background": "calm deep indigo evening sky", "image": "p03.webp", "audio": "p03.mp3", "safe": 0.349, "sky": "#00183a", "textTone": "light"}, {"text": "", "spokenText": "Three, two, one, WHOOSH! The rocket roared and rumbled and climbed up past the clouds.", "scene": "the orange rocket blasting off from the hill with a big soft puffy cloud of cream and orange smoke and a bright flame, rising low in the picture; seagulls and the sea below; joyful, not scary", "background": "calm deep indigo sky fading to darker blue", "image": "p04.webp", "audio": "p04.mp3", "safe": 0.068, "sky": "#02507e", "textTone": "light"}, {"text": "", "spokenText": "Out in space, everything floated. Her crackers drifted by, and Earth looked like a blue and white marble.", "scene": "inside the cozy rocket cabin, the little astronaut floats happily upside down, reaching for a few crackers drifting in the air; through a big round window at the bottom of the picture the blue and white Earth is visible", "background": "plain smooth soft cream-gray cabin ceiling", "image": "p05.webp", "audio": "p05.mp3", "safe": 0.5, "sky": "#011128", "textTone": "light"}, {"text": "", "spokenText": "Soon the Moon grew big and gray and bumpy. She landed gently with a soft, dusty thump.", "scene": "the orange rocket landing upright on four legs on the gray bumpy moon surface, small puffs of moon dust around its feet; craters and soft gray hills along the bottom", "background": "black-indigo space with only a few tiny faint stars", "image": "p06.webp", "audio": "p06.mp3", "safe": 0.089, "sky": "#01091b", "textTone": "light"}, {"text": "", "spokenText": "She bounced across the Moon in giant, floaty hops. Every step felt like jumping on a trampoline!", "scene": "the little astronaut in mid-air doing a big joyful floaty hop over the gray moon dust, arms out, leaving boot prints behind; the parked orange rocket small in the distance", "background": "black-indigo space with only a few tiny faint stars", "image": "p07.webp", "audio": "p07.mp3", "safe": 0.109, "sky": "#010d23", "textTone": "light"}, {"text": "", "spokenText": "She followed Pebble's wheel tracks around craters, the deep round bowls made by falling space rocks.", "scene": "the little astronaut walking along a line of six-wheel tracks curving around a big round crater on the moon, shining a small flashlight; gentle gray hills", "background": "black-indigo space with only a few tiny faint stars", "image": "p08.webp", "audio": "p08.mp3", "safe": 0.307, "sky": "#043e63", "textTone": "light"}, {"text": "", "spokenText": "At last she found Pebble at the bottom of a crater. His wheels spun, but he was stuck in dust.", "scene": "looking down into a wide shallow moon crater: Pebble sits at the bottom, half sunk in soft gray dust with his wheels spinning; the little astronaut kneels at the crater rim waving to him; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p09.webp", "audio": "p09.mp3", "safe": 0.354, "sky": "#00040e", "textTone": "light"}, {"text": "", "spokenText": "She slid down and pushed him up the slope, but swoosh! Her boots slipped right back down.", "scene": "inside the crater, the little astronaut pushing Pebble from behind with all her might, her moon boots sliding in the dust with little dust puffs; funny, determined, not scary; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p10.webp", "audio": "p10.mp3", "safe": 0.406, "sky": "#00112b", "textTone": "light"}, {"text": "", "spokenText": "She tied on a rope and pulled, but Pebble rolled a little and slid back down. Oh dear!", "scene": "the little astronaut halfway up the crater slope pulling a rope tied to Pebble, leaning back; Pebble sliding backwards a bit in the dust; light, comic; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p11.webp", "audio": "p11.mp3", "safe": 0.406, "sky": "#00091a", "textTone": "light"}, {"text": "", "spokenText": "She sat and thought hard, because engineers never give up. They look closely and try a new idea.", "scene": "the little astronaut sitting on a moon rock beside Pebble at the bottom of the crater, chin in her hand, thinking, looking closely at him; her red toolbox open beside her; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p12.webp", "audio": "p12.mp3", "safe": 0.411, "sky": "#01193d", "textTone": "light"}, {"text": "", "spokenText": "Then she noticed his solar panels were covered in dust. No sunlight meant no power to climb!", "scene": "close view of the little astronaut and Pebble: she points at Pebble's two blue solar panels, which are covered with a thick layer of gray dust; his headlight eyes are dim; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p13.webp", "audio": "p13.mp3", "safe": 0.312, "sky": "#022046", "textTone": "light"}, {"text": "", "spokenText": "She brushed every panel until it sparkled. Then she laid flat metal ramps from her toolbox across the dust.", "scene": "the little astronaut laying two flat silver metal ramp strips across the dust leading up the crater slope; Pebble behind her has clean shining blue solar panels; a small brush in her other hand; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p14.webp", "audio": "p14.mp3", "safe": 0.391, "sky": "#000c20", "textTone": "light"}, {"text": "", "spokenText": "Pebble's lights blinked on with a happy beep, beep! His wheels gripped the ramps, and up, up, up he rolled!", "scene": "Pebble climbing up the silver ramps out of the crater, headlight eyes glowing bright, antenna light blinking red; the little astronaut cheering beside the ramps with both arms up; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p15.webp", "audio": "p15.mp3", "safe": 0.302, "sky": "#000000", "textTone": "light"}, {"text": "", "spokenText": "At the top, Pebble spun happy circles. The little astronaut laughed and gave him a gentle high five.", "scene": "on the crater rim, Pebble spinning a happy circle leaving round tracks; the little astronaut giving his raised little robot arm a gentle high five; the blue and white Earth small and low on the horizon to the side; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p16.webp", "audio": "p16.mp3", "safe": 0.396, "sky": "#012148", "textTone": "light"}, {"text": "", "spokenText": "Little Pebble rolled off to explore again. The little astronaut waved goodbye and zoomed home toward Earth.", "scene": "the orange rocket flying low across the picture toward a big blue and white Earth near the bottom corner, a soft trail behind it; far below on the gray moon edge, tiny Pebble waves an arm; Other characters: Pebble, ONE small friendly six-wheeled rover robot about knee-high, with a boxy pale teal body, two round glowing headlight eyes, a short antenna with a tiny red light on top and two flat blue solar panels on its sides like little wings", "background": "black-indigo space with only a few tiny faint stars", "image": "p17.webp", "audio": "p17.mp3", "safe": 0.521, "sky": "#001d35", "textTone": "light"}, {"text": "", "spokenText": "With a splash, her capsule landed in the calm sea, and a boat carried her safely back to shore.", "scene": "a small round orange capsule bobbing in calm sea water under three striped orange and white parachutes resting on the water; a little wooden boat with a friendly captain pulling alongside; the seaside town and lighthouse on the shore", "background": "calm soft pink and lavender evening sky", "image": "p18.webp", "audio": "p18.mp3", "safe": 0.474, "sky": "#eaa7dc", "textTone": "dark"}, {"text": "", "spokenText": "That night, she watched the Moon from her cozy bed. Somewhere up there, Pebble was beeping goodnight.", "scene": "a cozy bedroom at night: the little astronaut, now in orange pajamas with no helmet, snuggled in bed under a blue quilt with rocket patterns, smiling sleepily at a round window; a toy rocket on a shelf; a small warm lamp", "background": "plain smooth deep blue bedroom wall", "image": "p19.webp", "audio": "p19.mp3", "safe": 0.427, "sky": "#013162", "textTone": "light"}], "end": {"text": "The end. Goodnight, little astronaut, and sweet dreams!", "audio": "end.mp3"}, "layout": "fullbleed"}</script>
