<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Palatino Linotype, Palatino, Georgia, serif">
<title>Schematic plan of Teotihuacan's ceremonial core (not to scale)</title>
<rect width="1200" height="700" fill="#0d1424"/>
<rect x="0.5" y="0.5" width="1199" height="699" fill="none" stroke="#c9a54a55"/>
<text x="600" y="38" text-anchor="middle" fill="#f1e6c8" font-size="24" letter-spacing="3">TEOTIHUACAN · CEREMONIAL CORE</text>
<text x="600" y="62" text-anchor="middle" fill="#8f8a7c" font-size="14" font-style="italic">Schematic sketch, not to scale. The real avenue runs about 15° east of north; this drawing is straightened.</text>

<!-- North arrow -->
<line x1="110" y1="130" x2="110" y2="78" stroke="#e8c46a" stroke-width="2"/>
<polygon points="110,68 104,84 116,84" fill="#e8c46a"/>
<text x="110" y="148" text-anchor="middle" fill="#e8c46a" font-size="13">N</text>

<!-- Avenue of the Dead -->
<rect x="555" y="95" width="90" height="500" fill="#c9a54a22" stroke="#e8c46a88"/>
<text x="600" y="355" text-anchor="middle" fill="#f1e6c8" font-size="13" letter-spacing="1" transform="rotate(-90 600 355)">AVENUE OF THE DEAD</text>

<!-- Pyramid of the Moon + plaza -->
<polygon points="600,100 555,155 645,155" fill="#4a7ec966" stroke="#e8c46a99"/>
<rect x="520" y="155" width="160" height="70" fill="#c9a54a18" stroke="#e8c46a66"/>
<text x="720" y="128" text-anchor="start" fill="#f1e6c8" font-size="15">Pyramid of the Moon</text>
<line x1="645" y1="128" x2="715" y2="128" stroke="#8f8a7c"/>

<!-- Pyramid of the Sun (east of avenue) -->
<polygon points="820,250 740,370 900,370" fill="#c96a4a77" stroke="#e8c46aaa"/>
<polygon points="820,278 760,355 880,355" fill="#c96a4a33" stroke="#e8c46a66"/>
<text x="930" y="318" text-anchor="start" fill="#f1e6c8" font-size="16">Pyramid of the Sun</text>
<line x1="900" y1="312" x2="925" y2="312" stroke="#8f8a7c"/>

<!-- San Juan River -->
<path d="M160,430 C320,410 480,455 555,448 L645,448 C760,442 900,470 1080,455" fill="none" stroke="#6aa8d8" stroke-width="4"/>
<text x="200" y="418" fill="#6aa8d8" font-size="13">San Juan River (diverted)</text>

<!-- Ciudadela (south, east of / around avenue) -->
<rect x="470" y="510" width="260" height="130" fill="#7a6a9a33" stroke="#e8c46a88"/>
<polygon points="680,535 650,595 710,595" fill="#c9a54a77" stroke="#e8c46aaa"/>
<text x="600" y="655" text-anchor="middle" fill="#f1e6c8" font-size="14">Ciudadela</text>
<text x="750" y="575" text-anchor="start" fill="#f1e6c8" font-size="14">Temple of the</text>
<text x="750" y="593" text-anchor="start" fill="#f1e6c8" font-size="14">Feathered Serpent</text>
<line x1="710" y1="575" x2="745" y2="575" stroke="#8f8a7c"/>

<!-- Great Compound opposite -->
<rect x="300" y="510" width="155" height="130" fill="#4a7ec933" stroke="#e8c46a66"/>
<text x="377" y="580" text-anchor="middle" fill="#d8d2c0" font-size="13">Great Compound</text>

<text x="40" y="682" fill="#8f8a7c" font-size="12">Diagram: Obsidian Archive. Layout follows UNESCO and excavation descriptions of the Avenue of the Dead, the two main pyramids, the Ciudadela and the redirected river.</text>
</svg>
